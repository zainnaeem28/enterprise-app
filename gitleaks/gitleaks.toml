# gitleaks configuration. Extends the default ruleset shipped with the pinned gitleaks version.
# Allow-list entries need an owner, a reason and an expiry (or a stated reason for none).
title = "enterprise-ehr gitleaks"

[extend]
useDefault = true

# Allow-list (owner: DevOps Engineer; reviewer: DevOps Reviewer). The synthetic identifiers in the
# design documents are not credentials; a false positive is reported here, never silently hidden.
#
# 1. `semgrep/rules/registry-snapshot.yml` is third-party rule text. It contains documentation
#    placeholders and key-header patterns (Slack webhook example, "BEGIN PRIVATE KEY" patterns) that
#    the secret rules match. It holds no credentials. Scoped to this one file for all rules; a secret
#    anywhere else still fails. No expiry: re-check whenever the snapshot is refreshed.
[[allowlists]]
description = "Third-party Semgrep rule text (patterns and placeholders), not credentials"
paths = ['''(^|/)semgrep/rules/registry-snapshot\.yml$''']

# INT03-F12 (owner: Cybersecurity; reviewer: Security Reviewer). Every main..HEAD finding was triaged
# individually (decision-log on HEAAA-359): all synthetic, no real credential. Each entry below pins
# one exact file set AND the exact synthetic value (condition = "AND"), so a real secret in the same
# file, or the same shape anywhere else, still fails. No expiry: re-check if the fixtures change.

# F12-a: deterministic test keys/tokens/ids in test code and test kits (rule generic-api-key).
[[allowlists]]
description = "INT03-F12-a: synthetic test keys and ids in test files (exact file + exact value)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)apps/api/src/modules/calendar-sync/oauth\.test\.ts$''',
  '''(^|/)apps/api/src/modules/clinical/(chart|frontdoor|notes)/testkit\.ts$''',
  '''(^|/)apps/api/src/modules/identity/(admin/)?testkit\.ts$''',
  '''(^|/)apps/api/src/modules/patient/testkit\.ts$''',
  '''(^|/)apps/api/src/modules/notifications/notifications\.dbtest\.ts$''',
  '''(^|/)apps/api/test/platform/db\.dbtest\.ts$''',
  '''(^|/)apps/staff/src/features/preconsult/desk\.test\.tsx$''',
  '''(^|/)apps/staff/src/features/preconsult/e2e/preconsult\.spec\.ts$''',
  '''(^|/)apps/worker/src/compose\.dbtest\.ts$''',
  '''(^|/)apps/worker/src/jobs/calendar-sync/(google-adapter|push-handler)\.test\.ts$''',
  '''(^|/)apps/worker/src/jobs/notifications/notifications\.dbtest\.ts$''',
]
regexes = [
  '''^decoy-key-for-tests-0123456789abcdef$''',
  '''^(csrf|rate|cursor|qr)-key-for-tests-0123456789abcdef(0123)?[0-9a-f]*$''',
  '''^csecret-0123456789$''',
  '''^RT-0123456789$''',
  '''^tok-12345678$''',
  '''^test-secret-0123456789$''',
  '''^0192abcd-1234-4abc-8def-0123456789ab$''',
  '''^q7Zk3Vn9Lw2Xc8Rb5TgYhA$''',
  '''^A1b2C3d4E5f6G7h8I9j0K_$''',
  '''^appointment_reminder_(48h|4h)$''',
]

# F12-b: notification template identifiers (public names, not secrets) in the template source.
[[allowlists]]
description = "INT03-F12-b: notification template keys in r1-templates.ts"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)apps/api/src/modules/notifications/r1-templates\.ts$''']
regexes = ['''^appointment_reminder_(48h|4h)$''']

# F12-c: M3 UI journey evidence log; only the two template-key values appear, no credentials.
[[allowlists]]
description = "INT03-F12-c: template_key values in the M3 journey evidence log"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)docs/evidence/integration/M3/raw/r(11|12)/ui/journey-run\.txt$''']
regexes = ['''^appointment_reminder_(48h|4h)$''']

# F12-d: the literal placeholder "sk_live_SUPERSECRET" used to prove error redaction (test input and
# the evidence note describing that test). Not a Stripe token; exact value only.
[[allowlists]]
description = "INT03-F12-d: fake sk_live_SUPERSECRET redaction-test marker"
condition = "AND"
targetRules = ["stripe-access-token"]
paths = [
  '''(^|/)apps/worker/src/jobs/integration-core/call-vendor\.test\.ts$''',
  '''(^|/)docs/evidence/integration/M4/INT-03-RESULT-r5\.md$''',
]
regexes = ['''^sk_live_SUPERSECRET$''']

# F12-g: history only. Commit f4644b81 first quoted the marker in the F12 decision log; the current
# tree no longer has the literal (reworded in INT03-F14). Pinned to that commit AND file AND value.
[[allowlists]]
description = "INT03-F14: historical F12 decision-log commit quoting the fake redaction marker"
condition = "AND"
targetRules = ["stripe-access-token"]
commits = ["f4644b81fbe8e8da0e20281d460b62742bb3763d"]
paths = ['''(^|/)docs/evidence/integration/M4/INT03-F12-decision-log\.md$''']
regexes = ['''^sk_live_SUPERSECRET$''']

# F12-e: infra plan-test fixtures (placeholder origin-verify header value, never applied) and a
# docker image sha256 digest printed in the foundation versions evidence (a public content hash).
[[allowlists]]
description = "INT03-F12-e: placeholder origin_verify_secret in terraform plan tests"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)infra/modules/(compute|edge)/tests/plan\.tftest\.hcl$''']
regexes = ['''^0123456789abcdef0123456789abcdef0123$''']

# INT05-N1 (owner: DevOps Engineer; input: Cybersecurity; reviewer: Security Reviewer). The DO-11
# commits 9a0625c and 15c52dd add two more fixtures carrying the same placeholder origin_verify_secret
# as F12-e: infra/modules/compute/examples/sg-wiring/main.tf and infra/modules/loadtest/tests/plan.tftest.hcl
# (2 hits). Never applied. Pinned to these two exact files AND the exact value (condition = "AND") and
# to this rule only: another value in these files, or this value in any other file, still fails.
# Covers history (the commits are not rewritten) and the tree. No expiry: re-check if the fixtures change.
[[allowlists]]
description = "INT05-N1: placeholder origin_verify_secret in the DO-11 compute example and loadtest plan test"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)infra/modules/compute/examples/sg-wiring/main\.tf$''',
  '''(^|/)infra/modules/loadtest/tests/plan\.tftest\.hcl$''',
]
regexes = ['''^0123456789abcdef0123456789abcdef0123$''']

[[allowlists]]
description = "INT03-F12-e: dockerfile sha256 digest in foundation versions evidence"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)docs/evidence/foundation/raw/00-versions\.txt$''']
regexes = ['''^5df716024056310597bc208745349d57e88f87e86079a35b42351a4e6b2647d2$''']

# F12-f: compiled (gitignored, untracked) build output of the same test files, seen only by the
# working-tree scan after a local build. Same exact synthetic values; absent in a clean CI checkout.
[[allowlists]]
description = "INT03-F12-f: compiled build output of the synthetic test fixtures (exact values)"
condition = "AND"
targetRules = ["generic-api-key", "stripe-access-token"]
paths = ['''(^|/)apps/(api|worker)/dist/.*\.(js|d\.ts)$''']
regexes = [
  '''^decoy-key-for-tests-0123456789abcdef$''',
  '''^(csrf|rate|cursor|qr)-key-for-tests-0123456789abcdef(0123)?[0-9a-f]*$''',
  '''^csecret-0123456789$''',
  '''^RT-0123456789$''',
  '''^tok-12345678$''',
  '''^test-secret-0123456789$''',
  '''^0192abcd-1234-4abc-8def-0123456789ab$''',
  '''^q7Zk3Vn9Lw2Xc8Rb5TgYhA$''',
  '''^A1b2C3d4E5f6G7h8I9j0K_$''',
  '''^sk_live_SUPERSECRET$''',
  '''^appointment_reminder_(48h|4h)$''',
]

# INT04-F07 (owner: DevOps Engineer; input: Cybersecurity; reviewer: Security Reviewer). The
# observability PHI-canary fixture deliberately holds one JWT-shaped string (header {"alg":"none"},
# payload {"sub":"CANARY"}, signature "CANARYSIGNATURE01"). It is unsigned and fake by construction;
# the telemetry tests assert it never reaches telemetry output, so its shape must stay realistic.
# Pinned to these two files AND the exact value (condition = "AND") and to rule jwt only: a different
# JWT in the same file, or this value anywhere else, still fails. Applies to history (commit
# 0bf3894) as well as the tree, so no history rewrite. No expiry: re-check if the fixture changes.
[[allowlists]]
description = "INT04-F07: synthetic unsigned JWT-shaped PHI canary in the observability test fixture"
condition = "AND"
targetRules = ["jwt"]
paths = ['''(^|/)infra/modules/observability/tests/phi-canaries\.json$''']
regexes = ['''^eyJhbGciOiJub25lIn0\.eyJzdWIiOiJDQU5BUlkifQ\.CANARYSIGNATURE01$''']

# INT04-F18 (owner: Cybersecurity; reviewer: Security Reviewer). The round-2 and round-3 integration
# evidence logs print the applied/pending migration file names as JSON; rule generic-api-key reads the name of
# migration 2406 as a key (r2 lines 251 and 397, commit f9274d7; the r3 log, commit 4360d7e, has the same value). It is a public file name, not a
# secret. Pinned to these two files AND the exact value (condition = "AND") and to this rule only:
# any other value in the file, or this name anywhere else, still fails. Covers history (commit
# f9274d7) and the tree, so no history rewrite. No expiry: the log is frozen evidence.
[[allowlists]]
description = "INT04-F18: migration file name in the r2 and r3 integration-db evidence logs"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/evidence/integration/M5/raw/int04-r2/gates/integration-db-partial-aborted\.txt$''',
  '''(^|/)docs/evidence/integration/M5/raw/int04-r3/gates/integration-db\.txt$''',
]
regexes = ['''^2406_notifications_staff_scope_allows_patient\.sql$''']

# INT04-F33 (owner: DevOps Engineer; reviewer: DevOps Reviewer). Same false positive as INT04-F18:
# the round-4 integration evidence logs (gates/integration-db.txt and the per-package reports) print
# the applied/pending migration file names as JSON, and the r9 result note quotes the same name;
# rule generic-api-key reads migration 2406's file name as a key (60 findings, commit fccc299, plus
# the r9 note). A public file name, not a secret. Pinned to these exact files AND the exact value
# (condition = "AND") and to this rule only: any other value in these files, or this name anywhere
# else, still fails. Covers history (fccc299, 5abb480) and the tree, so no history rewrite. No expiry:
# the logs are frozen evidence.
[[allowlists]]
description = "INT04-F33: migration file name in the r4 integration-db evidence logs and the r9 result note"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/evidence/integration/M5/raw/int04-r4/gates/integration-db\.txt$''',
  '''(^|/)docs/evidence/integration/M5/raw/int04-r4/gates/integration-db-reports/(api|kernel|worker)\.txt$''',
  '''(^|/)docs/evidence/integration/M5/INT-04-RESULT-r9\.md$''',
]
regexes = ['''^2406_notifications_staff_scope_allows_patient\.sql$''']

# INT04-F33 (continued; same owner and reviewer). The full-history scan also reports six synthetic
# test constants in older commits (abbdd6b, cfc7f66, 0de3e06), the same shapes as INT03-F12-a: a
# deterministic test key and the public template names appointment_reminder_48h/4h in test
# assertions. No credentials. Pinned to the exact file AND exact value (condition = "AND") and to
# this rule only, so the same value elsewhere, or any other value in these files, still fails.
[[allowlists]]
description = "INT04-F33: synthetic test key and template names in older test files (exact file + exact value)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)apps/worker/src/jobs/identity/admin-event\.dbtest\.ts$''',
  '''(^|/)tests/api/booking/(booking|notifications)\.test\.mjs$''',
]
regexes = [
  '''^qr-key-for-tests-0123456789abcdef0123$''',
  '''^appointment_reminder_(48h|4h)$''',
]

# INT04-F36 (owner: DevOps Engineer; reviewers: DevOps Reviewer, Security Reviewer). Same false
# positive as INT04-F18/F33: the r11 raw integration-db and prepare-db logs (commit f59c330) print the
# applied/pending migration file names as JSON, and rule generic-api-key reads migration 2406's file
# name as a key (130 findings). A public file name, not a secret. The logs are already in history and
# history may not be rewritten, so replacing them with summaries would not clear the scan. Pinned to
# these exact files AND the exact value (condition = "AND") and to this rule only: any other value in
# these files, this name elsewhere, or any non-evidence path still fails. Covers history and the
# tree. No expiry: the logs are frozen evidence.
[[allowlists]]
description = "INT04-F36: migration file name in the r11 raw integration-db and prepare-db evidence logs"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/evidence/integration/M5/r11/gates/integration-db-run[1-4]\.txt$''',
  '''(^|/)docs/evidence/integration/M5/r11/prepare-db[2-6]?\.txt$''',
]
regexes = ['''^2406_notifications_staff_scope_allows_patient\.sql$''']

# INT05-F05 (owner: DevOps Engineer; input: Cybersecurity; reviewer: Security Reviewer). The full-history
# scan reports 15 generic-api-key hits, each triaged individually (decision-log on HEAAA-593): none is a
# credential. History may not be rewritten, so each entry below is pinned to the exact commit AND exact
# file AND exact value (condition = "AND") and to this rule only. The same value in any other commit or
# file, or any other value in these files, still fails. No expiry: the commits are frozen history.
# F05-a: scripts/bootstrap/test/aws-result.test.mjs line 110 (commit 1836e0ae; the tree fixture was renamed to a non-key-shaped value): the last segment of a
# fake Secrets Manager ARN (account 111111111111) used as a negative test input for the result parser.
[[allowlists]]
description = "INT05-F05-a: fake secret ARN suffix in the aws-result parser negative test (commit + file + value)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["1836e0ae147613fd2fe13c98aef5200f1309dd5d"]
paths = ['''(^|/)scripts/bootstrap/test/aws-result\.test\.mjs$''']
regexes = ['''^other-AbC123$''']

# F05-b: tests/api/platform/admin.test.mjs lines 146, 149, 185, 189 (commit e8378fdd): the names of
# throw-away feature flags the QA-05 test creates (public identifiers, not secrets).
[[allowlists]]
description = "INT05-F05-b: QA-05 probe feature-flag names in admin.test.mjs (commit + file + value)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["e8378fdd7ed38091b489a0fef0ee7337fb917a38"]
paths = ['''(^|/)tests/api/platform/admin\.test\.mjs$''']
regexes = ['''^qa05_probe_flag2?$''']

# F05-c: five SEC-05 re-read evidence extracts (commit 8cb02eb5; frozen in the tree too, so pinned by file + value only), line 105 of each, two hits each: the
# migration file name 2406_notifications_staff_scope_allows_patient.sql in a JSON list of applied
# migrations (public file name; same false positive as INT04-F18/F33/F36).
[[allowlists]]
description = "INT05-F05-c: migration file name in five SEC-05 re-read evidence extracts (file + value)"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/evidence/integration/M5/sec05-reread/api-modules_audit_audit\.txt$''',
  '''(^|/)docs/evidence/integration/M5/sec05-reread/w-compose\.txt$''',
  '''(^|/)docs/evidence/integration/M5/sec05-reread/worker-audit\.txt$''',
  '''(^|/)docs/evidence/integration/M5/sec05-reread/worker-archive\.txt$''',
  '''(^|/)docs/evidence/integration/M5/sec05-reread/w-jobs_notifications_notifications\.txt$''',
]
regexes = ['''^2406_notifications_staff_scope_allows_patient\.sql$''']

# HEAAA-671 (owner: DevOps Engineer; reviewer: DevOps Reviewer). Merging the reviewed R2 evidence (QA
# execution 182d66a, quality-security 36d7c9a) and its history adds 124 generic-api-key hits, each
# triaged: none is a credential. Same false positive as INT04-F18/F33/F36: the integration-db logs print
# the applied migration file names as JSON and the rule reads migration 2406's file name as a key (120
# hits, a public file name). Pinned to these exact evidence files AND the exact value (condition = "AND")
# and to this rule only. Covers history and the tree; evidence stays byte-identical. No expiry: frozen.
[[allowlists]]
description = "HEAAA-671: migration file name in R1/R2 QA and quality-security integration-db evidence logs"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)docs/evidence/qa-execution/r2-cdc388d/raw/integration-db\.txt$''',
  '''(^|/)docs/evidence/qa-execution/unit-and-db/(api-integration-db|kernel-integration-db|worker-integration-db)\.txt$''',
  '''(^|/)docs/evidence/qa-execution/unit-and-db/integration-db-run\.log$''',
  '''(^|/)docs/quality-security/R1/integration-db\.log$''',
]
regexes = ['''^2406_notifications_staff_scope_allows_patient\.sql$''']

# HEAAA-671 (continued). History only: commit 19cea0d4 of tests/api/platform/admin.test.mjs (QA-05) holds
# the throw-away feature-flag names qa05_probe_flag and qa05_probe_flag2 (4 hits; the same public
# identifiers as INT05-F05-b, in another commit). Pinned to the commit AND file AND exact value.
[[allowlists]]
description = "HEAAA-671: QA-05 probe feature-flag names in admin.test.mjs (commit 19cea0d4 + file + value)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = [
  "19cea0d45f44cc0b2313439200566a61bba04b21",
  "25fea61a059cfbe174c1fb03774c631a5142d682", # HEAAA-674: prettier reformat of the same file; same two flag names at new lines
]
paths = ['''(^|/)tests/api/platform/admin\.test\.mjs$''']
regexes = ['''^qa05_probe_flag2?$''']
