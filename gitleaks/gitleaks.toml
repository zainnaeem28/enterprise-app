# gitleaks configuration. Extends the default ruleset shipped with the pinned gitleaks version.
# Allow-list entries need an owner, a reason and an expiry (or a stated reason for none).
title = "enterprise-ehr gitleaks"

[extend]
useDefault = true

# Allow-list (owner: DevOps Engineer; reviewer: DevOps Reviewer). The synthetic identifiers in the
# design documents are not credentials; a false positive is reported here, never silently hidden.
#
# 1. The Semgrep registry snapshot contains the vendor's documented Slack webhook placeholder
#    (T00000000/B00000000/XXXX...) inside a `pattern-not`. It is rule text, not a credential.
#    Scoped to one rule id and one file, so a real webhook anywhere else still fails. No expiry:
#    re-check whenever the snapshot is refreshed.
[[allowlists]]
description = "Semgrep rule text: Slack webhook placeholder in a pattern-not"
targetRules = ["slack-webhook-url"]
paths = ['''(^|/)semgrep/rules/registry-snapshot\.yml$''']
