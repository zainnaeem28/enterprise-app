# Production release (DO-06, HEAAA-97; DEVOPS-PLAN 4.2, 7.2, 7.4, 8.2, 9, 15.3).
#
# AUTHORED DISABLED (C-01). Nothing here can run against an environment until, in this order: DPR-37..39 are fixed,
# the staging proofs of 7.5 pass, a human applies the `release` approved-release record (approvals root), a human sets the
# repository variable DEPLOY_PRODUCTION_ENABLED=true and enables this workflow, and G3 for `production` is valid. The
# file holds no secret and no account identifier: every environment value is a GitHub *environment variable* of `production`.
#
# MANUAL DISPATCH ONLY. The input is a manifest hash; the first job re-derives it from the manifest bytes AND compares it
# with the manifest_hash in the approved-release record read from the production account (the input alone is not trusted).
# Sequence: verify -> backup/snapshot -> migrate -> worker -> api -> portals -> smoke -> [observe, read-only] -> [recover,
# only on failure after rollout began, only as the `recover` record allows].
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      manifest_hash:
        description: 'sha256 of release-manifest.json (the hash named in G3 and in the approved-release record)'
        required: true
        type: string
      build_run_id:
        description: 'build-release run that produced the manifest artifact (release-artifacts-<run id>)'
        required: true
        type: string
      previous_build_run_id:
        description: 'build-release run of the previous RELEASED manifest (rollback target). Leave empty only for the first production release'
        required: false
        type: string

permissions: {}

# One production release at a time; a running release is never cancelled (DPR-02, 4.2).
concurrency:
  group: production-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  WORK: ${{ github.workspace }}/deploy-work
  AWS_REGION: ${{ vars.DEPLOY_AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ vars.DEPLOY_AWS_REGION }}

jobs:
  enabled:
    name: enabled and on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Gate - from main; skip (with a notice) unless deliberately enabled
        id: gate
        env:
          ENABLED: ${{ vars.DEPLOY_PRODUCTION_ENABLED }}
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "::error::production deploys run from refs/heads/main only (got $REF)"; exit 1; }
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::not configured: DEPLOY_PRODUCTION_ENABLED (repository variable is not 'true'); no production deployment happened. This run is a skip, not a success of the real operation."
            printf '### Not configured: DEPLOY_PRODUCTION_ENABLED\n%s\n' "no production deployment happened. Nothing ran against any cloud account." >>"$GITHUB_STEP_SUMMARY"
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >>"$GITHUB_OUTPUT"

  deploy:
    name: verify, migrate, roll out, switch portals, smoke
    needs: [enabled]
    if: ${{ needs.enabled.outputs.enabled == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    permissions:
      contents: read
      actions: read # download the manifest artifact of the named build-release run
      id-token: write
    outputs:
      rollout_started: ${{ steps.mark.outputs.rollout_started }}
      git_sha: ${{ steps.verify.outputs.git_sha }}
      release_number: ${{ steps.verify.outputs.release_number }}
    env:
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      CLUSTER: ${{ vars.DEPLOY_CLUSTER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Fetch the release manifests (exact bytes)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
          PREV_RUN_ID: ${{ inputs.previous_build_run_id }}
        run: |
          mkdir -p "$WORK/current" "$WORK/previous"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-artifacts-$RUN_ID" --dir "$WORK/current"
          if [ -n "$PREV_RUN_ID" ]; then
            gh run download "$PREV_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-artifacts-$PREV_RUN_ID" --dir "$WORK/previous"
          fi

      - name: Assume gh-deploy-production (OIDC; denied by AWS unless the release record is applied and unexpired)
        run: scripts/deploy/aws-login.sh "$DEPLOY_ROLE_ARN" gh-deploy-production 7200

      - name: Read the approved-release record from the production account
        run: |
          aws ssm get-parameter --name /approved/release --with-decryption --query Parameter.Value --output text > "$WORK/record.json"

      - name: Verify manifest = dispatch hash = record (refuse on any mismatch)
        id: verify
        env:
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          PREV_RUN_ID: ${{ inputs.previous_build_run_id }}
        run: |
          prev=()
          if [ -n "$PREV_RUN_ID" ]; then prev=(--previous-manifest "$WORK/previous/release-manifest.json"); fi
          node scripts/deploy/verify-release.mjs --manifest "$WORK/current/release-manifest.json" --manifest-hash "$MANIFEST_HASH" \
            --record "$WORK/record.json" --environment production --actions rollout,smoke,portal-switch "${prev[@]}"

      - name: Task definitions registered for this manifest (pinned by ARN; never registered here)
        id: taskdefs
        env:
          MIGRATION_ARN: ${{ vars.DEPLOY_MIGRATION_TASKDEF_ARN }}
          DEPLOY_API_FAMILY: ${{ vars.DEPLOY_API_FAMILY }}
          DEPLOY_WORKER_FAMILY: ${{ vars.DEPLOY_WORKER_FAMILY }}
        run: |
          node scripts/deploy/resolve-taskdefs.mjs --manifest "$WORK/current/release-manifest.json" \
            --family "api=${DEPLOY_API_FAMILY}" --family "worker=${DEPLOY_WORKER_FAMILY}" \
            --migration-arn "$MIGRATION_ARN" --migration-image api

      - name: Backup freshness and the named restore point (8.2 steps 2-3)
        id: backup
        run: node scripts/deploy/backup-gate.mjs check --db "${DEPLOY_DB_INSTANCE}" --max-age-minutes "${DEPLOY_BACKUP_MAX_AGE_MINUTES}"
        env:
          DEPLOY_DB_INSTANCE: ${{ vars.DEPLOY_DB_INSTANCE }}
          DEPLOY_BACKUP_MAX_AGE_MINUTES: ${{ vars.DEPLOY_BACKUP_MAX_AGE_MINUTES }}

      - name: Manual snapshot before a migration (must be available, else abort before migration)
        if: ${{ steps.verify.outputs.new_migrations != '0' }}
        run: node scripts/deploy/backup-gate.mjs snapshot --db "${DEPLOY_DB_INSTANCE}" --sha "${STEP_VERIFY_GIT_SHA}" --timeout-minutes "${DEPLOY_SNAPSHOT_TIMEOUT_MINUTES}"
        env:
          DEPLOY_DB_INSTANCE: ${{ vars.DEPLOY_DB_INSTANCE }}
          STEP_VERIFY_GIT_SHA: ${{ steps.verify.outputs.git_sha }}
          DEPLOY_SNAPSHOT_TIMEOUT_MINUTES: ${{ vars.DEPLOY_SNAPSHOT_TIMEOUT_MINUTES }}

      - name: Mark that changes to the environment begin
        id: mark
        run: echo "rollout_started=true" >> "$GITHUB_OUTPUT"

      - name: Run the migration task (one-off, pinned definition, same image digest)
        if: ${{ steps.verify.outputs.new_migrations != '0' }}
        run: |
          node scripts/deploy/run-migration.mjs --cluster "$CLUSTER" --taskdef "${STEP_TASKDEFS_TASKDEF_MIGRATION}" \
            --subnets "${DEPLOY_SUBNETS}" --security-groups "${DEPLOY_SECURITY_GROUPS}" --timeout-minutes 30
        env:
          STEP_TASKDEFS_TASKDEF_MIGRATION: ${{ steps.taskdefs.outputs.taskdef_migration }}
          DEPLOY_SUBNETS: ${{ vars.DEPLOY_SUBNETS }}
          DEPLOY_SECURITY_GROUPS: ${{ vars.DEPLOY_SECURITY_GROUPS }}

      - name: min_client_release = release_number of the previous released manifest (6.2)
        run: node scripts/deploy/set-release-config.mjs --param "${DEPLOY_MIN_CLIENT_PARAM}" --value "${STEP_VERIFY_MIN_CLIENT_RELEASE}"
        env:
          DEPLOY_MIN_CLIENT_PARAM: ${{ vars.DEPLOY_MIN_CLIENT_PARAM }}
          STEP_VERIFY_MIN_CLIENT_RELEASE: ${{ steps.verify.outputs.min_client_release }}

      - name: Roll out worker, then api (ECS rolling, circuit breaker with rollback)
        run: |
          node scripts/deploy/rollout.mjs --cluster "$CLUSTER" \
            --service "worker=${DEPLOY_WORKER_SERVICE}:${STEP_TASKDEFS_TASKDEF_WORKER}" \
            --service "api=${DEPLOY_API_SERVICE}:${STEP_TASKDEFS_TASKDEF_API}"
        env:
          DEPLOY_WORKER_SERVICE: ${{ vars.DEPLOY_WORKER_SERVICE }}
          STEP_TASKDEFS_TASKDEF_WORKER: ${{ steps.taskdefs.outputs.taskdef_worker }}
          DEPLOY_API_SERVICE: ${{ vars.DEPLOY_API_SERVICE }}
          STEP_TASKDEFS_TASKDEF_API: ${{ steps.taskdefs.outputs.taskdef_api }}

      - name: Switch portal entry documents to this release
        run: |
          node scripts/deploy/portal-switch.mjs --bucket "${DEPLOY_PORTAL_BUCKET}" --sha "${STEP_VERIFY_GIT_SHA}" \
            --portal "${DEPLOY_PORTAL_NAME}" --distribution "${DEPLOY_PORTAL_DISTRIBUTION}"
        env:
          DEPLOY_PORTAL_BUCKET: ${{ vars.DEPLOY_PORTAL_BUCKET }}
          STEP_VERIFY_GIT_SHA: ${{ steps.verify.outputs.git_sha }}
          DEPLOY_PORTAL_NAME: ${{ vars.DEPLOY_PORTAL_NAME }}
          DEPLOY_PORTAL_DISTRIBUTION: ${{ vars.DEPLOY_PORTAL_DISTRIBUTION }}

      - name: Smoke checks
        run: |
          node scripts/deploy/smoke.mjs --api-url "${DEPLOY_API_URL}" --portal-url "${DEPLOY_PORTAL_URL}" \
            --release-number "${STEP_VERIFY_RELEASE_NUMBER}"
        env:
          DEPLOY_API_URL: ${{ vars.DEPLOY_API_URL }}
          DEPLOY_PORTAL_URL: ${{ vars.DEPLOY_PORTAL_URL }}
          STEP_VERIFY_RELEASE_NUMBER: ${{ steps.verify.outputs.release_number }}

      - name: Evidence
        if: ${{ !cancelled() }}
        env:
          MANIFEST_HASH: ${{ inputs.manifest_hash }}
          STEP_VERIFY_RELEASE_NUMBER: ${{ steps.verify.outputs.release_number }}
          STEP_VERIFY_GIT_SHA: ${{ steps.verify.outputs.git_sha }}
          STEP_VERIFY_NEW_MIGRATIONS: ${{ steps.verify.outputs.new_migrations }}
          STEP_BACKUP_RESTORE_POINT: ${{ steps.backup.outputs.restore_point }}
          STEP_TASKDEFS_TASKDEF_API: ${{ steps.taskdefs.outputs.taskdef_api }}
          STEP_TASKDEFS_TASKDEF_WORKER: ${{ steps.taskdefs.outputs.taskdef_worker }}
          STEP_VERIFY_MIN_CLIENT_RELEASE: ${{ steps.verify.outputs.min_client_release }}
        run: |
          {
            echo "### deploy-production"
            echo "- manifest hash (dispatch input, unverified text): $MANIFEST_HASH"
            echo "- release_number: ${STEP_VERIFY_RELEASE_NUMBER} (git ${STEP_VERIFY_GIT_SHA})"
            echo "- new migrations: ${STEP_VERIFY_NEW_MIGRATIONS}"
            echo "- restore point: ${STEP_BACKUP_RESTORE_POINT}"
            echo "- task definitions (pinned): api ${STEP_TASKDEFS_TASKDEF_API}, worker ${STEP_TASKDEFS_TASKDEF_WORKER}"
            echo "- min_client_release: ${STEP_VERIFY_MIN_CLIENT_RELEASE}"
          } >> "$GITHUB_STEP_SUMMARY"

  observe:
    name: observation window (read-only)
    needs: [deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      breach: ${{ steps.observe.outputs.breach }}
    env:
      DEPLOY_READ_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Assume gh-observe-production (CloudWatch, ECS and ALB reads only)
        run: scripts/deploy/aws-login.sh "${DEPLOY_OBSERVE_ROLE_ARN}" gh-observe-production 18000
        env:
          DEPLOY_OBSERVE_ROLE_ARN: ${{ vars.DEPLOY_OBSERVE_ROLE_ARN }}
      - name: Observe (aborts the job, never changes the environment)
        id: observe
        run: |
          node scripts/deploy/observe.mjs --minutes "${DEPLOY_OBSERVE_MINUTES}" --lb "${DEPLOY_LB}" \
            --tg "${DEPLOY_TG}" --alarm-prefix "${DEPLOY_ALARM_PREFIX}"
        env:
          DEPLOY_OBSERVE_MINUTES: ${{ vars.DEPLOY_OBSERVE_MINUTES }}
          DEPLOY_LB: ${{ vars.DEPLOY_LB }}
          DEPLOY_TG: ${{ vars.DEPLOY_TG }}
          DEPLOY_ALARM_PREFIX: ${{ vars.DEPLOY_ALARM_PREFIX }}

  recover:
    name: approved recovery (rollback redeploy), only after a failure
    needs: [deploy, observe]
    if: ${{ always() && needs.deploy.outputs.rollout_started == 'true' && (needs.deploy.result == 'failure' || needs.observe.outputs.breach == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Refuse when there is no previous release (first release - a person decides, see the runbook)
        env:
          PREV_RUN_ID: ${{ inputs.previous_build_run_id }}
        run: |
          [ -n "$PREV_RUN_ID" ] || { echo "::error::no previous release was named: nothing to redeploy. Follow ROLLBACK-RUNBOOK.md (take-down or pre-release snapshot); a person decides."; exit 1; }
      - name: Fetch the previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_RUN_ID: ${{ inputs.previous_build_run_id }}
        run: |
          mkdir -p "$WORK/previous"
          gh run download "$PREV_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-artifacts-$PREV_RUN_ID" --dir "$WORK/previous"
      - name: Assume gh-recover-production (denied unless its own `recover` record is applied and unexpired)
        run: scripts/deploy/aws-login.sh "${DEPLOY_RECOVER_ROLE_ARN}" gh-recover-production 7200
        env:
          DEPLOY_RECOVER_ROLE_ARN: ${{ vars.DEPLOY_RECOVER_ROLE_ARN }}
      - name: Read the recover record and verify it names this previous manifest and the rollback action
        id: verify
        run: |
          aws ssm get-parameter --name /approved/recover --with-decryption --query Parameter.Value --output text > "$WORK/record.json"
          prev_hash="$(sha256sum "$WORK/previous/release-manifest.json" | cut -d' ' -f1)"
          node scripts/deploy/verify-release.mjs --manifest "$WORK/previous/release-manifest.json" --manifest-hash "$prev_hash" \
            --record "$WORK/record.json" --environment production --actions rollback-redeploy --no-rollback-target --skip-min-client
      - name: Task definitions of the previous manifest
        id: taskdefs
        run: |
          node scripts/deploy/resolve-taskdefs.mjs --manifest "$WORK/previous/release-manifest.json" \
            --family "api=${DEPLOY_API_FAMILY}" --family "worker=${DEPLOY_WORKER_FAMILY}"
        env:
          DEPLOY_API_FAMILY: ${{ vars.DEPLOY_API_FAMILY }}
          DEPLOY_WORKER_FAMILY: ${{ vars.DEPLOY_WORKER_FAMILY }}
      - name: Portals first (restore the previous entry document), then api and worker (9.3, DPR-08)
        run: |
          node scripts/deploy/portal-switch.mjs --bucket "${DEPLOY_PORTAL_BUCKET}" --sha "${STEP_VERIFY_GIT_SHA}" \
            --portal "${DEPLOY_PORTAL_NAME}" --distribution "${DEPLOY_PORTAL_DISTRIBUTION}"
          node scripts/deploy/rollout.mjs --rollback --cluster "${DEPLOY_CLUSTER}" \
            --service "worker=${DEPLOY_WORKER_SERVICE}:${STEP_TASKDEFS_TASKDEF_WORKER}" \
            --service "api=${DEPLOY_API_SERVICE}:${STEP_TASKDEFS_TASKDEF_API}"
        env:
          DEPLOY_PORTAL_BUCKET: ${{ vars.DEPLOY_PORTAL_BUCKET }}
          STEP_VERIFY_GIT_SHA: ${{ steps.verify.outputs.git_sha }}
          DEPLOY_PORTAL_NAME: ${{ vars.DEPLOY_PORTAL_NAME }}
          DEPLOY_PORTAL_DISTRIBUTION: ${{ vars.DEPLOY_PORTAL_DISTRIBUTION }}
          DEPLOY_CLUSTER: ${{ vars.DEPLOY_CLUSTER }}
          DEPLOY_WORKER_SERVICE: ${{ vars.DEPLOY_WORKER_SERVICE }}
          STEP_TASKDEFS_TASKDEF_WORKER: ${{ steps.taskdefs.outputs.taskdef_worker }}
          DEPLOY_API_SERVICE: ${{ vars.DEPLOY_API_SERVICE }}
          STEP_TASKDEFS_TASKDEF_API: ${{ steps.taskdefs.outputs.taskdef_api }}
      - name: Report (an application rollback is not proof that the database is restored)
        run: |
          echo "### recovery redeploy ran: previous digests and portal pointer only. Schema state is NOT asserted; see ROLLBACK-RUNBOOK.md." >> "$GITHUB_STEP_SUMMARY"
