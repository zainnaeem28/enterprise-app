# Pull-request CI (HEAAA-68 / F-02; DEVOPS-PLAN 4.2 and 5.1).
#
# Rules for this file (enforced by the `workflow-hygiene` job):
#   - every `uses:` is a full 40-character commit SHA from .github/ACTIONS-ALLOWLIST.md;
#   - `permissions` is declared (none by default, `contents: read` per job);
#   - no `continue-on-error`, no `|| true`; every job has a timeout;
#   - no secrets other than the read-only GITHUB_TOKEN and no cloud credentials, so nothing here can
#     reach a cloud account, including from forks.
#
# integration-db, migration-check, contract (Schemathesis), a11y-smoke, e2e-smoke and bundle-budget
# (F-09, HEAAA-79) run on the application code; each ends with a seeded-violation control that must FAIL
# the gate. Container image scanning has nothing to scan until a Dockerfile exists; the job says so
# explicitly instead of reporting an image pass.
name: ci

on:
  push:
    branches: ['ci/HEAAA-79-*']

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI_TOOLS_DIR: ${{ github.workspace }}/.ci-tools
  CI: 'true'

jobs:
  workflow-hygiene:
    name: workflow-hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install actionlint (pinned, sha256-verified)
        run: scripts/ci/install-tools.sh actionlint
      - name: actionlint
        run: |
          mkdir -p reports/workflow-hygiene
          "$CI_TOOLS_DIR/bin/actionlint" -version > reports/workflow-hygiene/actionlint-version.txt
          "$CI_TOOLS_DIR/bin/actionlint" -color -verbose 2>&1 | tee reports/workflow-hygiene/actionlint.txt
      - name: SHA pins, allow-list, permissions, no swallowed failures
        run: node scripts/ci/check-workflow-hygiene.mjs 2>&1 | tee reports/workflow-hygiene/hygiene.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: workflow-hygiene-reports
          path: reports/workflow-hygiene
          if-no-files-found: error
          retention-days: 30

  lint-types:
    name: lint-types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Lint, format, types
        run: |
          mkdir -p reports/lint-types
          {
            echo "== pnpm lint"; pnpm lint
            echo "== pnpm format:check"; pnpm format:check
            echo "== pnpm typecheck"; pnpm typecheck
          } 2>&1 | tee reports/lint-types/lint-types.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lint-types-reports
          path: reports/lint-types
          if-no-files-found: error
          retention-days: 30

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Unit tests (an empty or skipped suite fails)
        run: node scripts/ci/run-unit.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: unit-reports
          path: reports/unit
          if-no-files-found: error
          retention-days: 30

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: |
          mkdir -p reports/build
          pnpm build 2>&1 | tee reports/build/build.txt
          find apps packages -path '*/node_modules' -prune -o -path '*/dist/*' -type f -print | sort > reports/build/dist-files.txt
          test -s reports/build/dist-files.txt || { echo "::error::build produced no output files"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: build-reports
          path: reports/build
          if-no-files-found: error
          retention-days: 30

  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Semgrep CE (pinned version, no account, no metrics)
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==1.184.0"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - name: Semgrep with the committed ruleset
        run: scripts/ci/sast.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sast-reports
          path: reports/sast
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install gitleaks (pinned, sha256-verified)
        run: scripts/ci/install-tools.sh gitleaks
      - name: gitleaks (PR commits; full history on main)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/secrets.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: secrets-reports
          path: reports/secrets
          if-no-files-found: error
          retention-days: 30

  deps:
    name: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner (pinned, sha256-verified)
        run: scripts/ci/install-tools.sh osv-scanner
      - name: OSV-Scanner on pnpm-lock.yaml
        run: scripts/ci/deps.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: deps-reports
          path: reports/deps
          if-no-files-found: error
          retention-days: 30

  container-scan:
    name: container-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Trivy (pinned, sha256-verified)
        run: scripts/ci/install-tools.sh trivy
      - name: Trivy config scan, then image scan of every Dockerfile
        run: scripts/ci/container-scan.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: container-scan-reports
          path: reports/container-scan
          if-no-files-found: error
          retention-days: 30

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Syft (pinned, sha256-verified)
        run: scripts/ci/install-tools.sh syft
      - name: Syft CycloneDX SBOM
        run: scripts/ci/sbom.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: sbom-reports
          path: reports/sbom
          if-no-files-found: error
          retention-days: 30

  # PostgreSQL 17 service container; migrations from empty and from the previous release tag; the database-backed suites
  # of every workspace; the previous release's suites against the candidate schema (N-1). DEVOPS-PLAN 4.2, 5.1, 5.2.
  integration-db:
    name: integration-db
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        # PostgreSQL 17 (SHARED-BOUNDARIES 4.1), pinned by the multi-arch index digest of postgres:17 (Docker Hub, 2026-11-06).
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          # Trust authentication: throwaway container on the runner, loopback only, synthetic data (docker/compose.ci.yml).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EHR_TEST_ADMIN_URL: postgres://postgres@127.0.0.1:55432/postgres
      REQUIRE_PREVIOUS_RELEASE_TAG: ${{ vars.REQUIRE_PREVIOUS_RELEASE_TAG || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Database suites, upgrade path and N-1
        run: scripts/ci/migration-check/integration-db.sh
      - name: Seeded-violation control (each seeded defect must fail the job)
        run: scripts/ci/migration-check/seed.sh integration-db
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: integration-db-reports
          path: reports
          if-no-files-found: error
          retention-days: 30

  # DEVOPS-PLAN 5.2: every migration rule, on a database migrated from empty and from the previous release tag.
  migration-check:
    name: migration-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        # PostgreSQL 17 (SHARED-BOUNDARIES 4.1), pinned by the multi-arch index digest of postgres:17 (Docker Hub, 2026-11-06).
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          # Trust authentication: throwaway container on the runner, loopback only, synthetic data (docker/compose.ci.yml).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EHR_TEST_ADMIN_URL: postgres://postgres@127.0.0.1:55432/postgres
      REQUIRE_PREVIOUS_RELEASE_TAG: ${{ vars.REQUIRE_PREVIOUS_RELEASE_TAG || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Migration rules
        run: scripts/ci/migration-check/migration-check.sh
      - name: Seeded-violation control (each seeded defect must fail the job)
        run: scripts/ci/migration-check/seed.sh migration-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: migration-check-reports
          path: reports
          if-no-files-found: error
          retention-days: 30

  # DEVOPS-PLAN 5.1 AL-07 / TC-API-09: Schemathesis against the API container on PostgreSQL 17.
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # PostgreSQL 17 (SHARED-BOUNDARIES 4.1), pinned by the multi-arch index digest of postgres:17 (Docker Hub, 2026-11-06).
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          # Trust authentication: throwaway container on the runner, loopback only, synthetic data (docker/compose.ci.yml).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EHR_TEST_ADMIN_URL: postgres://postgres@127.0.0.1:55432/postgres
      REQUIRE_PREVIOUS_RELEASE_TAG: ${{ vars.REQUIRE_PREVIOUS_RELEASE_TAG || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Schemathesis (pinned version, runner only)
        run: |
          python3 -m venv "$RUNNER_TEMP/schemathesis-venv"
          "$RUNNER_TEMP/schemathesis-venv/bin/pip" install --quiet "schemathesis==4.33.1"
          echo "$RUNNER_TEMP/schemathesis-venv/bin" >> "$GITHUB_PATH"
      - name: Migrate a database for the API
        run: scripts/ci/migration-check/prepare-db.sh ehr
      - name: Start the API container
        run: tests/e2e/smoke/api-container.sh start ehr
      - name: Schemathesis
        run: tests/e2e/smoke/contract/run.sh
      - name: Stop the API container
        if: ${{ always() }}
        run: tests/e2e/smoke/api-container.sh stop
      - name: Seeded-violation control (each seeded defect must fail the job)
        run: tests/e2e/smoke/seed.sh contract
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: contract-reports
          path: reports
          if-no-files-found: error
          retention-days: 30

  # DEVOPS-PLAN 5.1: axe-core on the built staff shell (serious or critical violations block).
  a11y-smoke:
    name: a11y-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @ehr/staff exec playwright install --with-deps chromium
      - name: Accessibility smoke
        env:
          SMOKE_PROJECT: a11y
          NODE_PATH: ${{ github.workspace }}/apps/staff/node_modules
        run: |
          pnpm --filter @ehr/staff exec playwright --version
          pnpm --filter @ehr/staff exec playwright test -c ../../tests/e2e/smoke/playwright.config.ts --project=a11y
      - name: Empty-suite guard
        run: node tests/e2e/smoke/check-report.mjs reports/smoke/a11y-report.json 8
      - name: Seeded-violation control (each seeded defect must fail the job)
        run: tests/e2e/smoke/seed.sh a11y-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: a11y-smoke-reports
          path: reports
          if-no-files-found: error
          retention-days: 30

  # DEVOPS-PLAN 5.1 AL-07: Playwright PR subset on the built shell, through the same-origin proxy to the API container.
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # PostgreSQL 17 (SHARED-BOUNDARIES 4.1), pinned by the multi-arch index digest of postgres:17 (Docker Hub, 2026-11-06).
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          # Trust authentication: throwaway container on the runner, loopback only, synthetic data (docker/compose.ci.yml).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EHR_TEST_ADMIN_URL: postgres://postgres@127.0.0.1:55432/postgres
      REQUIRE_PREVIOUS_RELEASE_TAG: ${{ vars.REQUIRE_PREVIOUS_RELEASE_TAG || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @ehr/staff exec playwright install --with-deps chromium
      - name: Migrate a database for the API
        run: scripts/ci/migration-check/prepare-db.sh ehr
      - name: Start the API container
        run: tests/e2e/smoke/api-container.sh start ehr
      - name: End-to-end smoke
        env:
          SMOKE_PROJECT: e2e
          NODE_PATH: ${{ github.workspace }}/apps/staff/node_modules
        run: |
          pnpm --filter @ehr/staff exec playwright --version
          pnpm --filter @ehr/staff exec playwright test -c ../../tests/e2e/smoke/playwright.config.ts --project=e2e
      - name: Stop the API container
        if: ${{ always() }}
        run: tests/e2e/smoke/api-container.sh stop
      - name: Empty-suite guard
        run: node tests/e2e/smoke/check-report.mjs reports/smoke/e2e-report.json 6
      - name: Seeded-violation control (each seeded defect must fail the job)
        env:
          API_ORIGIN: http://127.0.0.1:3000
        run: tests/e2e/smoke/seed.sh e2e-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-smoke-reports
          path: reports
          if-no-files-found: error
          retention-days: 30

  # DEVOPS-PLAN 5.1: Lighthouse CI against the NFR-7 budget (LCP < 2.5 s on simulated 4G) plus the script-weight ceiling.
  bundle-budget:
    name: bundle-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (frozen lockfile)
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Chromium for Playwright (Lighthouse uses it)
        run: pnpm --filter @ehr/staff exec playwright install --with-deps chromium
      - name: Gzip ceiling of the built shell
        run: |
          mkdir -p reports/bundle-budget
          node tests/e2e/smoke/bundle-gzip.mjs 2>&1 | tee reports/bundle-budget/gzip.txt
      - name: Lighthouse CI (pinned version, runner only)
        env:
          LHCI_VERSION: 0.16.0
        run: |
          CHROME_PATH="$(pnpm --filter @ehr/staff exec node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          export CHROME_PATH
          echo "chrome: $CHROME_PATH" | tee reports/bundle-budget/chrome.txt
          pnpm dlx "@lhci/cli@$LHCI_VERSION" autorun --config=lighthouserc.cjs 2>&1 | tee reports/bundle-budget/lhci.txt
      - name: Empty-run guard
        run: node tests/e2e/smoke/check-lighthouse.mjs reports/bundle-budget/lhci 3
      - name: Seeded-violation control (each seeded defect must fail the job)
        env:
          LHCI_VERSION: 0.16.0
        run: |
          CHROME_PATH="$(pnpm --filter @ehr/staff exec node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          export CHROME_PATH
          tests/e2e/smoke/seed.sh bundle-budget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bundle-budget-reports
          path: reports
          if-no-files-found: error
          retention-days: 30

  # Single required check for the branch ruleset (when the plan can enforce one). A skipped or
  # cancelled job is a failure here.
  ci-status:
    name: ci-status
    if: ${{ always() }}
    needs:
      [
        workflow-hygiene,
        lint-types,
        unit,
        build,
        sast,
        secrets,
        deps,
        container-scan,
        sbom,
        integration-db,
        migration-check,
        contract,
        a11y-smoke,
        e2e-smoke,
        bundle-budget,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Every required job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/check-needs.mjs
