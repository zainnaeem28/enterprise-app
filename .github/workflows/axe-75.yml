name: axe-75
on:
  push:
    branches: [ci/HEAAA-75-axe-b527dde]
permissions:
  contents: read
jobs:
  axe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: git rev-parse HEAD
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ehr/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @ehr/ui exec playwright --version
      - id: run
        run: mkdir -p packages/ui/dist-reports && pnpm --filter @ehr/ui test:a11y 2>&1 | tee packages/ui/dist-reports/playwright-output.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: axe-report-b527dde
          path: |
            packages/ui/dist-reports
            packages/ui/test-results
      - if: steps.run.outcome != 'success'
        run: exit 1
