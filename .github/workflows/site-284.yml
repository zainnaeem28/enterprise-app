name: site-284
on:
  push:
    branches: [ci/HEAAA-284-site-a1953ec]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: git rev-parse HEAD
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @ehr/site build
      - run: pnpm --filter @ehr/site exec playwright install --with-deps chromium
      - run: pnpm --filter @ehr/site exec playwright --version
      - id: e2e
        run: mkdir -p apps/site/dist-reports && pnpm --filter @ehr/site test:a11y 2>&1 | tee apps/site/dist-reports/playwright-output.txt
        continue-on-error: true
      - id: lh
        working-directory: apps/site
        run: |
          CHROME_PATH="$(pnpm exec node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          export CHROME_PATH
          echo "chrome: $CHROME_PATH"
          mkdir -p dist-reports
          LHCI_OUTPUT_DIR=dist-reports/lhci pnpm dlx @lhci/cli@0.16.0 autorun --config=lighthouserc.cjs 2>&1 | tee dist-reports/lhci.txt
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: site-reports
          path: |
            apps/site/dist-reports
            apps/site/test-results
          if-no-files-found: warn
      - if: steps.e2e.outcome != 'success' || steps.lh.outcome != 'success'
        run: exit 1
