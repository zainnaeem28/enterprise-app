# Load-test environment: create -> seed/run -> always-run teardown (DO-11 follow-up B, HEAAA-589).
# Manual only: nothing applies on push or pull_request. Spend needs the approval configured on the
# GitHub environment `loadtest` (required reviewers); this file grants no approval itself.
# Credentials: GitHub OIDC -> AWS role (no stored keys). Details: docs/loadtest-workflow.md.
name: loadtest-run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique run id, 3-24 chars: lower-case letters, digits, hyphen (e.g. 20261110-01)'
        required: true
        type: string
      ttl_hours:
        description: 'Hours until expires_at (1-24; hard maximum 24, decision D-1)'
        required: true
        default: '8'
        type: string
      run_cost_ceiling_usd:
        description: 'Per-run cost ceiling in USD (from the plan artifact price list)'
        required: true
        type: string
      confirm_apply:
        description: 'Type the run id again to confirm this creates billable infrastructure'
        required: true
        type: string

# Least privilege by default; the job adds only id-token.
permissions: {}

# One loadtest stack at a time. Never cancel a running job: cancelling would skip teardown.
concurrency:
  group: loadtest-stack
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  loadtest:
    name: create, test, teardown
    runs-on: ubuntu-24.04
    environment: loadtest # protection rules (required reviewers) gate the whole job
    timeout-minutes: 600
    permissions:
      id-token: write # OIDC token for AWS
      contents: read
    env:
      RUN_ID: ${{ inputs.run_id }}
      TTL_HOURS: ${{ inputs.ttl_hours }}
      CEILING: ${{ inputs.run_cost_ceiling_usd }}
      CONFIRM: ${{ inputs.confirm_apply }}
      AWS_REGION: us-east-2
      ROOT: infra/modules/loadtest/root
      IAC_BIN: tofu
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[a-z0-9][a-z0-9-]{2,23}$ ]] || { echo "bad run_id" >&2; exit 1; }
          [[ "$CONFIRM" == "$RUN_ID" ]] || { echo "confirm_apply must equal run_id" >&2; exit 1; }
          [[ "$TTL_HOURS" =~ ^([1-9]|1[0-9]|2[0-4])$ ]] || { echo "ttl_hours must be 1-24" >&2; exit 1; }
          [[ "$CEILING" =~ ^[0-9]+(\.[0-9]+)?$ ]] && awk -v c="$CEILING" 'BEGIN{exit !(c>0)}' \
            || { echo "run_cost_ceiling_usd must be a positive number" >&2; exit 1; }
          [ -n "${{ vars.LOADTEST_AWS_ROLE_ARN }}" ] || { echo "environment variable LOADTEST_AWS_ROLE_ARN not set" >&2; exit 1; }
          echo "EXPIRES_AT=$(date -u -d "+${TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "START_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ vars.LOADTEST_TOFU_VERSION }}
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.LOADTEST_AWS_ROLE_ARN }}
          role-session-name: loadtest-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 14400

      - name: Install pinned k6
        run: tests/load/harness/install-k6.sh

      # Cost guard before anything is created: refuses to start when spend already tagged to this
      # run id has reached the ceiling (for example a re-used id).
      - name: Cost guard (before create)
        run: tests/load/harness/guard-cost.sh "$RUN_ID" "$CEILING" "$START_DATE"

      - name: Fetch non-secret variables and production profile
        run: |
          set -euo pipefail
          aws s3 cp "${{ vars.LOADTEST_TFVARS_S3_URI }}" "$RUNNER_TEMP/common.tfvars.json"
          aws s3 cp "${{ vars.LOADTEST_PROD_PROFILE_S3_URI }}" "$RUNNER_TEMP/prod-profile.json"
          jq -n --arg r "$RUN_ID" --arg e "$EXPIRES_AT" --arg o "github:${{ github.actor }}" --argjson c "$CEILING" \
            '{run_id:$r, expires_at:$e, owner:$o, run_cost_ceiling_usd:$c}' > "$RUNNER_TEMP/run.tfvars.json"
          secret=$(openssl rand -hex 32); echo "::add-mask::$secret"
          echo "TF_VAR_origin_verify_secret=$secret" >> "$GITHUB_ENV"
          # Remote state, one key per run, so teardown and the reaper find it. The thin root has no backend.
          cat > "$ROOT/backend_override.tf" <<TF
          terraform {
            backend "s3" {
              bucket       = "${{ vars.LOADTEST_STATE_BUCKET }}"
              key          = "loadtest/${RUN_ID}/terraform.tfstate"
              region       = "us-east-2"
              use_lockfile = true
              encrypt      = true
            }
          }
          TF
          echo "TFVARS_ARGS=-var-file=$RUNNER_TEMP/common.tfvars.json -var-file=$RUNNER_TEMP/run.tfvars.json" >> "$GITHUB_ENV"

      # From here teardown must run. It is armed before the first resource can exist.
      - name: Init
        id: init
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" init -input=false
          # L4: no committed provider lock file yet; fail if the lock cannot be produced for all platforms.
          tofu -chdir="$ROOT" providers lock -platform=linux_amd64 -platform=linux_arm64

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          tofu -chdir="$ROOT" plan -input=false -out="$RUNNER_TEMP/plan.bin" $TFVARS_ARGS
          tofu -chdir="$ROOT" show -json "$RUNNER_TEMP/plan.bin" > "$RUNNER_TEMP/plan.json"
          jq '.planned_values.outputs.profile.value // .planned_values.outputs.profile' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/loadtest-profile.json"

      # L-gate: the first real create requires an equivalence pass against production's profile.
      - name: Check production equivalence
        run: node tests/load/harness/check-equivalence.mjs "$RUNNER_TEMP/prod-profile.json" "$RUNNER_TEMP/loadtest-profile.json"

      - name: Upload plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loadtest-plan-${{ inputs.run_id }}
          path: ${{ runner.temp }}/loadtest-profile.json
          retention-days: 30

      - name: Create (apply)
        id: apply
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" apply -input=false "$RUNNER_TEMP/plan.bin"
          tofu -chdir="$ROOT" output -json seeder_run_task > "$RUNNER_TEMP/seeder_run_task.json"

      - name: Seed synthetic data
        run: tests/load/harness/seed.sh "$RUNNER_TEMP/seeder_run_task.json"

      - name: Cost guard (after seed)
        run: tests/load/harness/guard-cost.sh "$RUN_ID" "$CEILING" "$START_DATE"

      # QA-07 owns the scenarios; they are added here as steps between the two cost guards.
      - name: Run load scenarios
        run: |
          echo "No QA-07 scenarios are wired yet; environment created and seeded only."

      - name: Cost guard (after tests)
        run: tests/load/harness/guard-cost.sh "$RUN_ID" "$CEILING" "$START_DATE"

      # Always runs once the job is past input checks and init was attempted, including after
      # failure, cancellation by timeout, and a failed apply (partial resources).
      - name: Teardown (always)
        if: always() && steps.init.outcome != 'skipped'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          tests/load/harness/teardown.sh "$ROOT" "$RUN_ID" $TFVARS_ARGS
