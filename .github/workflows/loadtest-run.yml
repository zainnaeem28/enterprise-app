# Load-test environment: create -> seed/run -> always-run teardown (DO-11 follow-up B, HEAAA-589).
# Manual only: nothing applies on push or pull_request. Spend needs the approval configured on the
# GitHub environment `loadtest` (required reviewers); this file grants no approval itself.
# Credentials: GitHub OIDC -> AWS role (no stored keys). Details: docs/loadtest-workflow.md.
name: loadtest-run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique run id, 3-24 chars: lower-case letters, digits, hyphen (e.g. 20261110-01)'
        required: true
        type: string
      ttl_hours:
        description: 'Hours until expires_at (1-24; hard maximum 24, decision D-1)'
        required: true
        default: '8'
        type: string
      run_cost_ceiling_usd:
        description: 'Per-run cost ceiling in USD (from the plan artifact price list)'
        required: true
        type: string
      confirm_apply:
        description: 'Type the run id again to confirm this creates billable infrastructure'
        required: true
        type: string

# Least privilege by default; the job adds only id-token.
permissions: {}

# One loadtest stack at a time. Never cancel a running job: cancelling would skip teardown.
concurrency:
  group: loadtest-stack
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: configuration check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      REQUIRED: LOADTEST_AWS_ROLE_ARN LOADTEST_STATE_BUCKET LOADTEST_TFVARS_S3_URI LOADTEST_PROD_PROFILE_S3_URI
      LOADTEST_AWS_ROLE_ARN: ${{ vars.LOADTEST_AWS_ROLE_ARN }}
      LOADTEST_STATE_BUCKET: ${{ vars.LOADTEST_STATE_BUCKET }}
      LOADTEST_TFVARS_S3_URI: ${{ vars.LOADTEST_TFVARS_S3_URI }}
      LOADTEST_PROD_PROFILE_S3_URI: ${{ vars.LOADTEST_PROD_PROFILE_S3_URI }}
    steps:
      - name: Skip with a notice when the load-test environment is not configured
        id: check
        run: |
          missing=""
          for v in $REQUIRED; do [ -n "${!v:-}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=load-test not configured::The DO-11 environment is authored but not applied; there is no AWS account or role yet. Missing repository/environment variables:$missing. NO load test was created or run and no AWS call was made."
            { echo "### load test NOT RUN"; echo "Not configured (missing:$missing). Nothing was created, seeded or measured."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  loadtest:
    needs: gate
    if: ${{ needs.gate.outputs.configured == 'true' }}
    name: create, test, teardown
    runs-on: ubuntu-24.04
    environment: loadtest # protection rules (required reviewers) gate the whole job
    timeout-minutes: 600
    permissions:
      id-token: write # OIDC token for AWS
      contents: read
    env:
      RUN_ID: ${{ inputs.run_id }}
      TTL_HOURS: ${{ inputs.ttl_hours }}
      CEILING: ${{ inputs.run_cost_ceiling_usd }}
      CONFIRM: ${{ inputs.confirm_apply }}
      AWS_REGION: us-east-2
      ROOT: infra/modules/loadtest/root
      IAC_BIN: tofu
      TOFU_VERSION: '1.13.9'
      TOFU_SHA256: 'bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce'
      CI_TOOLS_DIR: ${{ github.workspace }}/.ci-tools
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[a-z0-9][a-z0-9-]{2,23}$ ]] || { echo "bad run_id" >&2; exit 1; }
          [[ "$CONFIRM" == "$RUN_ID" ]] || { echo "confirm_apply must equal run_id" >&2; exit 1; }
          [[ "$TTL_HOURS" =~ ^([1-9]|1[0-9]|2[0-4])$ ]] || { echo "ttl_hours must be 1-24" >&2; exit 1; }
          [[ "$CEILING" =~ ^[0-9]+(\.[0-9]+)?$ ]] && awk -v c="$CEILING" 'BEGIN{exit !(c>0)}' \
            || { echo "run_cost_ceiling_usd must be a positive number" >&2; exit 1; }
          [ -n "${{ vars.LOADTEST_AWS_ROLE_ARN }}" ] || { echo "environment variable LOADTEST_AWS_ROLE_ARN not set" >&2; exit 1; }
          echo "EXPIRES_AT=$(date -u -d "+${TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "START_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu (pinned, sha256-verified)
        run: |
          mkdir -p "$CI_TOOLS_DIR/bin" "$CI_TOOLS_DIR/dl"
          curl --fail --silent --show-error --location --retry 3 --output "$CI_TOOLS_DIR/dl/tofu.zip" "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          echo "$TOFU_SHA256  $CI_TOOLS_DIR/dl/tofu.zip" | sha256sum --check --strict -
          unzip -o -q "$CI_TOOLS_DIR/dl/tofu.zip" tofu -d "$CI_TOOLS_DIR/bin"
          echo "$CI_TOOLS_DIR/bin" >>"$GITHUB_PATH"

      - name: Assume the load-test role (OIDC)
        run: scripts/deploy/aws-login.sh "${{ vars.LOADTEST_AWS_ROLE_ARN }}" "loadtest-${RUN_ID}" 14400

      - name: Install pinned k6
        run: tests/load/harness/install-k6.sh "$RUNNER_TEMP/k6"

      # Cost guard before anything is created: refuses to start when spend already tagged to this
      # run id has reached the ceiling (for example a re-used id).
      - name: Cost guard (before create)
        run: tests/load/harness/guard-cost.sh "$RUN_ID" "$CEILING" "$START_DATE"

      - name: Fetch non-secret variables and production profile
        run: |
          set -euo pipefail
          aws s3 cp "${{ vars.LOADTEST_TFVARS_S3_URI }}" "$RUNNER_TEMP/common.tfvars.json"
          aws s3 cp "${{ vars.LOADTEST_PROD_PROFILE_S3_URI }}" "$RUNNER_TEMP/prod-profile.json"
          jq -n --arg r "$RUN_ID" --arg e "$EXPIRES_AT" --arg o "github:${{ github.actor }}" --argjson c "$CEILING" \
            '{run_id:$r, expires_at:$e, owner:$o, run_cost_ceiling_usd:$c}' > "$RUNNER_TEMP/run.tfvars.json"
          secret=$(openssl rand -hex 32); echo "::add-mask::$secret"
          echo "TF_VAR_origin_verify_secret=$secret" >> "$GITHUB_ENV"
          # Remote state, one key per run, so teardown and the reaper find it. The thin root has no backend.
          cat > "$ROOT/backend_override.tf" <<TF
          terraform {
            backend "s3" {
              bucket       = "${{ vars.LOADTEST_STATE_BUCKET }}"
              key          = "loadtest/${RUN_ID}/terraform.tfstate"
              region       = "us-east-2"
              use_lockfile = true
              encrypt      = true
            }
          }
          TF
          echo "TFVARS_ARGS=-var-file=$RUNNER_TEMP/common.tfvars.json -var-file=$RUNNER_TEMP/run.tfvars.json" >> "$GITHUB_ENV"

      # From here teardown must run. It is armed before the first resource can exist.
      - name: Init
        id: init
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" init -input=false
          # L4: no committed provider lock file yet; fail if the lock cannot be produced for all platforms.
          tofu -chdir="$ROOT" providers lock -platform=linux_amd64 -platform=linux_arm64

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          tofu -chdir="$ROOT" plan -input=false -out="$RUNNER_TEMP/plan.bin" $TFVARS_ARGS
          tofu -chdir="$ROOT" show -json "$RUNNER_TEMP/plan.bin" > "$RUNNER_TEMP/plan.json"
          jq '.planned_values.outputs.profile.value // .planned_values.outputs.profile' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/loadtest-profile.json"

      # L-gate: the first real create requires an equivalence pass against production's profile.
      - name: Check production equivalence
        run: node tests/load/harness/check-equivalence.mjs "$RUNNER_TEMP/prod-profile.json" "$RUNNER_TEMP/loadtest-profile.json"

      - name: Upload plan evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadtest-plan-${{ inputs.run_id }}
          path: ${{ runner.temp }}/loadtest-profile.json
          retention-days: 30

      - name: Create (apply)
        id: apply
        run: |
          set -euo pipefail
          tofu -chdir="$ROOT" apply -input=false "$RUNNER_TEMP/plan.bin"
          tofu -chdir="$ROOT" output -json seeder_run_task > "$RUNNER_TEMP/seeder_run_task.json"

      - name: Seed synthetic data
        run: tests/load/harness/seed.sh "$RUNNER_TEMP/seeder_run_task.json"

      - name: Cost guard (after seed)
        run: tests/load/harness/guard-cost.sh "$RUN_ID" "$CEILING" "$START_DATE"

      # QA-07 scenarios (HEAAA-776): perf-01..04, 06..08, rec-04/rec-07 via tests/load/run-load.sh (run-suite.sh runs them in order and
      # prints one verdict table). TC-PERF-05 is Lighthouse, not here. Inputs the seeder does not yet emit (sessions, ids, API URL) come
      # from the variables below; if any is missing the step FAILS (nothing measured). A case that cannot run (no vendor sandbox, no
      # read-only DB URL) is NOT_RUN and also fails the run: it is never a pass. No disruption (TC-REC OPS part) is injected here.
      # continue-on-error so the cost guard below still runs; "Scenario verdict" then fails the job.
      - name: Run load scenarios
        id: scenarios
        continue-on-error: true
        env:
          ENV_NAME: loadtest
          BASE_URL: ${{ vars.LOADTEST_BASE_URL }}
          LOADTEST_HOSTS: ${{ vars.LOADTEST_HOSTS }}
          CANDIDATE_COMMIT: ${{ github.sha }}
          VENDOR_SANDBOX: ${{ vars.LOADTEST_VENDOR_SANDBOX }}
          LOADTEST_SESSIONS_S3_URI: ${{ vars.LOADTEST_SESSIONS_S3_URI }}
          LOADTEST_IDS_S3_URI: ${{ vars.LOADTEST_IDS_S3_URI }}
          LOADTEST_RO_DATABASE_URL_SECRET_ID: ${{ vars.LOADTEST_RO_DATABASE_URL_SECRET_ID }}
          INFRA_SIZING_NOTE: loadtest run ${{ inputs.run_id }} (sizing recorded in the plan artifact)
        run: |
          set -euo pipefail
          export K6_BIN="$RUNNER_TEMP/k6/k6" REPORT_ROOT="$RUNNER_TEMP/load-reports"
          for v in LOADTEST_SESSIONS_S3_URI LOADTEST_IDS_S3_URI; do
            [ -n "${!v:-}" ] || { echo "::error title=load inputs missing::$v is not set; NO load test ran." >&2; exit 78; }
          done
          aws s3 cp "$LOADTEST_SESSIONS_S3_URI" "$RUNNER_TEMP/sessions.json"
          aws s3 cp "$LOADTEST_IDS_S3_URI" "$RUNNER_TEMP/ids.json"
          export SESSIONS_FILE="$RUNNER_TEMP/sessions.json" IDS_FILE="$RUNNER_TEMP/ids.json"
          if [ -n "${LOADTEST_RO_DATABASE_URL_SECRET_ID:-}" ]; then
            LOADTEST_RO_DATABASE_URL="$(aws secretsmanager get-secret-value --secret-id "$LOADTEST_RO_DATABASE_URL_SECRET_ID" --query SecretString --output text)"
            echo "::add-mask::$LOADTEST_RO_DATABASE_URL"; export LOADTEST_RO_DATABASE_URL
          fi
          tests/load/run-suite.sh

      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loadtest-reports-${{ inputs.run_id }}
          path: ${{ runner.temp }}/load-reports
          if-no-files-found: ignore
          retention-days: 30

      - name: Cost guard (after tests)
        run: tests/load/harness/guard-cost.sh "$RUN_ID" "$CEILING" "$START_DATE"

      - name: Scenario verdict
        if: always() && steps.scenarios.outcome == 'failure'
        run: |
          echo "::error title=load scenarios not green::At least one scenario failed or was NOT_RUN (see the verdict table). Not a pass."
          exit 1

      # Always runs once the job is past input checks and init was attempted, including after
      # failure, cancellation by timeout, and a failed apply (partial resources).
      - name: Teardown (always)
        if: always() && steps.init.outcome != 'skipped'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          tests/load/harness/teardown.sh "$ROOT" "$RUN_ID" $TFVARS_ARGS
