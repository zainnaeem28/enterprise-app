name: axe-160
on:
  push:
    branches: [ci/HEAAA-160-axe-51732d6]
permissions:
  contents: read
jobs:
  axe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51732d6508a7c8c1f72cf3e8ad6c1a4aa4aaa4cd
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: git rev-parse HEAD
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ehr/staff build
      - run: pnpm --filter @ehr/staff exec playwright install --with-deps chromium
      - run: pnpm --filter @ehr/staff exec playwright --version
      - id: run
        run: mkdir -p apps/staff/dist-reports && pnpm --filter @ehr/staff test:a11y 2>&1 | tee apps/staff/dist-reports/playwright-output.txt
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: axe-report-51732d6
          path: |
            apps/staff/dist-reports
            apps/staff/test-results
      - if: steps.run.outcome != 'success'
        run: exit 1
