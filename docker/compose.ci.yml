# CI and local database service for the integration and migration checks (DEVOPS-PLAN 3.1 `ci`, 5.2).
# Synthetic data only. Trust authentication is acceptable ONLY because the port is bound to loopback and the
# container is thrown away after the run; no environment other than `ci` may use this file.
#
#   docker compose -f docker/compose.ci.yml up -d --wait
#   export EHR_TEST_ADMIN_URL=postgres://postgres@127.0.0.1:55432/postgres
services:
  postgres:
    # TODO(DevOps, F-02/F-09): pin by image digest (DEVOPS-PLAN 6.1). The digest was not resolvable from the
    # build host; `17` is the major line the architecture requires (SHARED-BOUNDARIES 4.1).
    image: postgres:17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
