# CI and local database service for the integration and migration checks (DEVOPS-PLAN 3.1 `ci`, 5.2).
# Synthetic data only. Trust authentication is acceptable ONLY because the port is bound to loopback and the
# container is thrown away after the run; no environment other than `ci` may use this file.
#
#   docker compose -f docker/compose.ci.yml up -d --wait
#   export EHR_TEST_ADMIN_URL=postgres://postgres@127.0.0.1:55432/postgres
services:
  postgres:
    # Pinned by index digest (DEVOPS-PLAN 6.1), resolved from Docker Hub on 2026-11-11 for the `17` tag
    # (major line required by SHARED-BOUNDARIES 4.1). Refresh deliberately: re-resolve `postgres:17`, run the
    # integration and migration checks, then replace the digest.
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
