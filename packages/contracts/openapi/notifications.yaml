components:
  schemas:
    Alert:
      type: object
      properties:
        alertId:
          type: string
          format: uuid
        seq:
          type: integer
        type:
          type: string
        severity:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        escalationLevel:
          type: integer
        escalatesAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        acknowledgedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        acknowledgedBy:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        acknowledgedByDisplayName:
          oneOf:
            - type: string
            - type: 'null'
        patientId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        resourceType:
          oneOf:
            - type: string
            - type: 'null'
        resourceId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        link:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - alertId
        - seq
        - type
        - severity
        - status
        - createdAt
        - escalationLevel
        - escalatesAt
    GetAdminMessageTemplatesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetAlertsOpenIdsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              alertId:
                type: string
                format: uuid
              seq:
                type: integer
              status:
                type: string
              escalationLevel:
                type: integer
              escalatesAt:
                oneOf:
                  - type: string
                    format: date-time
                  - type: 'null'
            required:
              - alertId
              - seq
              - status
              - escalationLevel
              - escalatesAt
      required:
        - items
    GetAlertsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - items
        - nextCursor
    GetNoticesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    NotificationsErrorCode:
      type: string
      enum:
        - notifications.render_check_failed
        - notifications.alert_closed
      x-registry:
        - code: notifications.render_check_failed
          http: '422'
          retryable: no
        - code: notifications.alert_closed
          http: '409'
          retryable: no
      description: Section 30 error codes with the notifications prefix.
    PostAlertsByIdAcknowledgeResponse:
      type: object
      properties:
        alertId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - acknowledged
        acknowledgedAt:
          type: string
          format: date-time
        acknowledgedBy:
          type: string
          format: uuid
        escalationLevel:
          type: integer
        escalatesAt:
          type: string
          enum:
            - 'null'
        alreadyAcknowledged:
          type: boolean
      required:
        - alertId
        - status
        - acknowledgedAt
        - acknowledgedBy
        - escalationLevel
        - escalatesAt
        - alreadyAcknowledged
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: notifications
    description: Module notifications
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
