  /api/v1/alerts/{id}/acknowledge:
    post:
      operationId: postAlertsByIdAcknowledge
      tags:
        - notifications
      summary: POST /api/v1/alerts/{id}/acknowledge
      description: "staff.: Records the time (AC-08). Draft 8, AL-02: sets `status = 'acknowledged'`, `acknowledged_by`, `acknowledged_at` and **`escalate_at = NULL`** in one transaction, so a pending escalation job finds nothing to do (32.4). `200 {alertId, status: 'acknowledged', acknowledgedAt, acknowledgedBy, escalationLevel, escalatesAt: null, alreadyAcknowledged}`. If another target acknowledged first, `200` with the stored values and `alreadyAcknowledged: true`, and no new alert event. `409 notifications.alert_closed` if the alert is closed"
      x-access:
        staff:
          permission: notifications.alert.acknowledge
          resolver: own targets
          realm: google
          idempotencyKey: true
          ifMatch: false
          pathAs: /api/v1/alerts/{id}/acknowledge
          catalogueRow: 29.3#107
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: common.yaml#/components/parameters/ClientRelease
        - $ref: common.yaml#/components/parameters/IdempotencyKey
      x-error-codes:
