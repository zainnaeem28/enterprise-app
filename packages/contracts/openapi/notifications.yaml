  /api/v1/alerts:
    get:
      operationId: getAlerts
      tags:
        - notifications
      summary: GET /api/v1/alerts
      description: "staff.: The alerts page (interactive). **`status=open` means `staff_alert.status IN ('open','escalated')`** (draft 8.1, N-6): an escalated alert is not yet acknowledged, so it stays in the list and in the tray of every target, including targets added by the escalation. Draft 8, AL-02: `{items: [{alertId, seq, type, severity, status, createdAt, escalationLevel, escalatesAt, acknowledgedAt, acknowledgedBy, acknowledgedByDisplayName, patientId, resourceType, resourceId, link}], nextCursor}`. `escalatesAt` is `staff_alert.escalate_at`: set while the alert is `open` and an escalation is scheduled; **`null`** when acknowledged, closed, already escalated (R1 schedules one escalation per alert, 25.5, 32.4) or when no escalation time is configured (for `red_flag`, until the D-12a reviewer sets `red_flag_escalation_minutes`). `acknowledgedByDisplayName` comes from `identity.staffProfile` (staff audience). The client computes the countdown as `escalatesAt` minus the server time from the response `Date` header, adjusted by the local time elapsed since, never from the device clock alone"
      x-access:
        staff:
          permission: notifications.alert.read
          resolver: own targets
          realm: google
          idempotencyKey: false
          ifMatch: false
          pathAs: /api/v1/alerts
          catalogueRow: 29.3#105
      security:
        - sessionCookie: []
      parameters:
        - $ref: common.yaml#/components/parameters/ClientRelease
        - name: status
          in: query
          required: false
          schema:
            type: string
      x-error-codes:
