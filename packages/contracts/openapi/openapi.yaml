x-source:
  document: docs/ARCHITECTURE.md
  revision: Draft 8.1
  sha256: 1e7fe57ed94d4412b836e2d0d7be201685fba18d7d94c07baad432ee1808bbae
x-reserved-routes:
  - host: integrations
    method: POST
    path: /partner/v1/*
    reason: 'Row 29.5 "POST /partner/v1/*": R3, designed with R2/R3 (22.17). A wildcard is not an OpenAPI path and the catalogue defines no operation; it is counted in the route-count check as reserved, not transcribed.'
x-limits:
  jsonBodyBytes: 1048576
  noteAutosavePatchBodyBytes: 262144
  webhookBodyBytes: 262144
  headerBytes: 16384
  requestTimeoutSeconds: 15
  source: ARCHITECTURE 31.2 (CN-12)
x-catalogue-interpretations:
  - id: I-01
    where: 29.1-29.5 first cells using shorthand
    text: Rows that write '…/x', list several paths in one cell or leave a path implicit are expanded by the explicit table scripts/contracts/route-expansions.mjs, keyed by the exact cell text. Every expansion is a literal reading; the table is the line-by-line transcription for review.
  - id: I-02
    where: 29.3 and 29.2 document-upload rows
    text: "'POST /patients/{patientId}/document-uploads, …/complete' (29.3, 'As 29.2') is read as POST /document-uploads/{documentId}/complete, the path 29.2 gives."
  - id: I-03
    where: 29.3 video-session row
    text: "'GET /appointments/{id}/video-session, POST …/admit, …/join, …/end' is read as sub-paths of /video-session (admit, join, end), consistent with the patient routes 29.2 gives (/video-session/join)."
  - id: I-04
    where: 29.4 rows using 'GET/POST/PATCH /admin/x'
    text: PATCH on a collection path is transcribed literally (no identifier) and flagged x-catalogue-gap. The Solution Architect should confirm whether /{id} was meant.
  - id: I-05
    where: 29.3 and 29.4 blocked-times and roster rows
    text: DELETE on the collection path (/blocked-times, /roster) is transcribed literally and flagged x-catalogue-gap; the catalogue names no identifier.
  - id: I-06
    where: 29.4 dagger (†)
    text: † applies to the code span it follows (per route), which is how the rows read; for a row with one dagger after the last item only that item is marked elevationRequired.
  - id: I-07
    where: Idem / If-Match columns
    text: "Idempotency-Key is required on POST routes of a row marked Idem (28.3 says 'portal POST'). If-Match is required on every PATCH route (28.2, CN-07: PATCH on an existing resource), whatever the row marks, and on PUT and DELETE routes of a row marked If-Match, and on these state-changing POSTs of such rows: appointments cancel, reschedule, check-in, no-show; questionnaire-responses submit; notes sign; encounters complete; documents confirm. 'If-Match on PUT' applies to PUT only. Per-host differences are kept in x-access; the parameter is then optional with a description."
  - id: I-08
    where: Routes on both my. and staff.
    text: One operation carries both hosts in x-access when method and normalised path coincide (OpenAPI cannot hold two operations on one path). The path parameter name of the first host is used ({reservationId} for appointments); the document's own spelling is kept in x-access.<host>.pathAs. Where the two hosts return different bodies the response is a oneOf.
  - id: I-09
    where: Success statuses
    text: Where a row states a status (201, 202, 302) it is used; where it does not, the success status is 200 and the shape is OpaqueObject unless fields are named. The document gives no 204.
  - id: I-10
    where: Bodies not enumerated
    text: 'Fields are named only where draft 8.1 names them. Everything else is common.yaml OpaqueObject (x-schema-status: shape-not-specified-in-draft-8.1). The owning module ticket completes its shapes in its own module file as a reviewed contract change.'
  - id: I-11
    where: List responses
    text: GET collections and the rows marked Paged return {items, nextCursor} per 28.2; items are OpaqueObject unless fields are named.
  - id: I-12
    where: CSRF
    text: auth.csrf_failed and csrfToken exist, but draft 8.1 does not name the header that carries the token, so no header is declared.
  - id: I-13
    where: Common errors
    text: The common statuses of section 29 (400, 401, 403, 404, 409 patient.merged, 412, 429, 503) are on every route they apply to; 428 and 412 on If-Match routes; 413 on routes with a body; 504 kernel.timeout; 400 kernel.client_release_unsupported on portal routes outside the 28.6 exempt list; 400 kernel.idempotency_key_required and 409 kernel.idempotency_conflict on Idem routes. Module codes come from the row notes.
  - id: I-14
    where: 29.5 POST /partner/v1/*
    text: Reserved for R2/R3 (22.17); a wildcard is not an OpenAPI path and the catalogue defines no operation. Listed in x-reserved-routes and counted by the route-count check.
  - id: I-15
    where: Module ownership
    text: The catalogue does not assign routes to modules; the split follows the permission prefix, the table owning the data (22.x) and the module that exposes the function. Webhooks are in integration-core (they all enter through integration_core.receive_inbound, 29.5); /api/v1/auth and admin auth are identity; GET /services, /locations, /clinicians (C0 directory, 22.5.1) are organisation; check-in-qr and /admin/clinicians/* roster and templates are scheduling.
