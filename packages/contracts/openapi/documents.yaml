components:
  schemas:
    DocumentsErrorCode:
      type: string
      enum:
        - documents.type_not_allowed
        - documents.too_large
        - documents.not_available
        - documents.legal_hold
        - documents.retention
      x-registry:
        - code: documents.type_not_allowed
          http: 409/413/422
          retryable: no
        - code: documents.too_large
          http: 409/413/422
          retryable: no
        - code: documents.not_available
          http: 409/413/422
          retryable: no
        - code: documents.legal_hold
          http: 409/413/422
          retryable: no
        - code: documents.retention
          http: 409/413/422
          retryable: no
      description: Section 30 error codes with the documents prefix.
    GetPatientsByPatientIdDocumentsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        patientBanner:
          $ref: common.yaml#/components/schemas/PatientBanner
          description: Present on `staff.` only (ARCHITECTURE 28.2, BR-34); absent on `my.`.
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    PostDocumentsByDocumentIdDownloadUrlResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
        - url
        - expiresAt
    PostDocumentsByIdLegalHoldsRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - placed
            - released
        reason:
          type: string
          maxLength: 500
      required:
        - action
        - reason
    PostDocumentUploadsByDocumentIdCompleteResponse202:
      type: object
      properties:
        status:
          type: string
          enum:
            - scanning
      required:
        - status
    PostPatientsByPatientIdDocumentUploadsResponse201:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        uploadHeaders:
          type: object
          properties: {}
          additionalProperties: true
        expiresAt:
          type: string
          format: date-time
      required:
        - documentId
        - uploadUrl
        - uploadHeaders
        - expiresAt
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: documents
    description: Module documents
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
