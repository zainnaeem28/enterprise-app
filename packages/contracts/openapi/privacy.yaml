components:
  schemas:
    GetAdminIncidentsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetAdminPrivacyRequestsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetPrivacyRequestsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    PostPrivacyRequestsRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
            - access
            - export
            - correction
            - deletion
      required:
        - kind
      additionalProperties: true
    PrivacyErrorCode:
      type: string
      enum:
        - privacy.export_not_ready
        - privacy.blocked_on_decision
      x-registry:
        - code: privacy.export_not_ready
          http: '409'
          retryable: no
        - code: privacy.blocked_on_decision
          http: '409'
          retryable: no
      description: Section 30 error codes with the privacy prefix.
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: privacy
    description: Module privacy
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
