components:
  schemas:
    AuditErrorCode:
      type: string
      enum:
        - audit.export_too_large
        - audit.self_review
      x-registry:
        - code: audit.export_too_large
          http: 403/422
          retryable: no
        - code: audit.self_review
          http: 403/422
          retryable: no
      description: Section 30 error codes with the audit prefix.
    GetAdminBtgGrantsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    PostAdminAuditEventsSearchRequest:
      type: object
      properties:
        from:
          type: string
          format: date-time
          description: Half-open range [from, to), from < to; the range is at most 31 days (31.1).
        to:
          type: string
          format: date-time
          description: Half-open range [from, to), from < to; the range is at most 31 days (31.1).
        actorPersonId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        action:
          type: string
        resourceType:
          type: string
      required:
        - from
        - to
    PostAdminAuditExportsRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
        - reason
      additionalProperties: true
    PostPatientsByPatientIdBreakGlassRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 10
      required:
        - reason
    PostPatientsByPatientIdBreakGlassResponse201:
      type: object
      properties:
        grantId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
      required:
        - grantId
        - expiresAt
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: audit
    description: Module audit
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
