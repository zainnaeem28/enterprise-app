components:
  schemas:
    GetAdminDeadLettersResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetAdminIntegrationsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    IntegrationCoreErrorCode:
      type: string
      enum:
        - integration.vendor_rejected
        - integration.vendor_unavailable
      x-registry:
        - code: integration.vendor_rejected
          http: 502/503
          retryable: second yes
        - code: integration.vendor_unavailable
          http: 502/503
          retryable: second yes
      description: Section 30 error codes with the integration-core prefix.
    PostAdminIntegrationsByIdTestResponse:
      type: object
      properties:
        health:
          type: string
        checkedAt:
          type: string
          format: date-time
      required:
        - health
        - checkedAt
    PutAdminIntegrationsByIdSecretsByNameRequest:
      type: object
      properties:
        value:
          type: string
      required:
        - value
    PutAdminIntegrationsByIdSecretsByNameResponse:
      type: object
      properties:
        versionId:
          type: string
      required:
        - versionId
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: integration-core
    description: Module integration-core
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
