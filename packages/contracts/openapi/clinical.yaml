components:
  schemas:
    ClinicalErrorCode:
      type: string
      enum:
        - clinical.not_assigned
        - clinical.consents_missing
        - clinical.note_locked
        - clinical.note_unsigned
        - clinical.cosign_not_supervisor
        - clinical.invalid_transition
        - clinical.uncoded_requires_display
        - clinical.referral_target_invalid
        - clinical.referral_not_pending
        - clinical.vital_range_overlap
      x-registry:
        - code: clinical.not_assigned
          http: '403'
          retryable: no
        - code: clinical.consents_missing
          http: '409'
          retryable: no
        - code: clinical.note_locked
          http: 403/409/422
          retryable: no
        - code: clinical.note_unsigned
          http: 403/409/422
          retryable: no
        - code: clinical.cosign_not_supervisor
          http: 403/409/422
          retryable: no
        - code: clinical.invalid_transition
          http: 403/409/422
          retryable: no
        - code: clinical.uncoded_requires_display
          http: 403/409/422
          retryable: no
        - code: clinical.referral_target_invalid
          http: '422'
          retryable: no
        - code: clinical.referral_not_pending
          http: '409'
          retryable: no
        - code: clinical.vital_range_overlap
          http: '409'
          retryable: no
      description: Section 30 error codes with the clinical prefix.
    GetAdminVitalRangesResponse:
      type: object
      required:
