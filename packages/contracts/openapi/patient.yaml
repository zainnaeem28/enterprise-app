      x-error-codes:
        '400':
          - kernel.client_release_unsupported
          - kernel.idempotency_key_required
          - kernel.validation_failed
        '401':
          - auth.unauthenticated
        '403':
          - auth.forbidden
        '404':
          - kernel.not_found
        '409':
          - kernel.idempotency_conflict
          - patient.already_linked
          - patient.merged
        '413':
          - kernel.payload_too_large
        '429':
          - kernel.rate_limited
        '503':
          - kernel.unavailable
        '504':
          - kernel.timeout
      responses:
        '201':
          description: Success (201)
          headers:
            X-Request-Id:
              $ref: common.yaml#/components/headers/XRequestId
            Cache-Control:
              $ref: common.yaml#/components/headers/CacheNoStore
            X-Session-Idle-Expires-At:
              $ref: common.yaml#/components/headers/XSessionIdleExpiresAt
            Idempotent-Replay:
              $ref: common.yaml#/components/headers/IdempotentReplay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPatientsSelfRegistrationResponse201'
        '400':
          $ref: common.yaml#/components/responses/Error400
          description: 'Codes: kernel.client_release_unsupported, kernel.idempotency_key_required, kernel.validation_failed.'
        '401':
          $ref: common.yaml#/components/responses/Error401
          description: 'Codes: auth.unauthenticated.'
        '403':
          $ref: common.yaml#/components/responses/Error403
          description: 'Codes: auth.forbidden.'
        '404':
          $ref: common.yaml#/components/responses/Error404
          description: 'Codes: kernel.not_found.'
        '409':
          $ref: common.yaml#/components/responses/Error409
          description: 'Codes: kernel.idempotency_conflict, patient.already_linked, patient.merged.'
        '413':
          $ref: common.yaml#/components/responses/Error413
          description: 'Codes: kernel.payload_too_large.'
        '429':
          $ref: common.yaml#/components/responses/Error429
          description: 'Codes: kernel.rate_limited.'
        '503':
          $ref: common.yaml#/components/responses/Error503
          description: 'Codes: kernel.unavailable.'
        '504':
          $ref: common.yaml#/components/responses/Error504
          description: 'Codes: kernel.timeout.'
components:
  schemas:
    PatientLookupItem:
      type: object
      additionalProperties: false
      required:
        - patientId
        - mrn
        - givenName
        - middleName
        - familyName
        - dateOfBirth
      properties:
        patientId:
          type: string
          format: uuid
        mrn:
          type: string
        givenName:
          type: string
        middleName:
          oneOf:
            - type: string
            - type: 'null'
        familyName:
          type: string
        dateOfBirth:
          type: string
          format: date
    PostPatientsLookupRequest:
      description: Exactly one criteria form. `phone`, `email`, `dateOfBirth` alone and mixed forms are refused.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - mrn
          properties:
            mrn:
              type: string
        - type: object
          additionalProperties: false
          required:
            - name
          properties:
            name:
              type: string
              description: At most 4 words, each of at least 2 characters; prefix match on given or family name.
            dateOfBirth:
              type: string
              format: date
        - type: object
          additionalProperties: false
          required:
            - patientIds
          properties:
            patientIds:
              type: array
              minItems: 1
              maxItems: 25
              items:
                type: string
                format: uuid
    PostPatientsLookupResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - truncated
      properties:
        items:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/PatientLookupItem'
        truncated:
          type: boolean
    GetAdminConsentsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetDuplicateFlagsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetPatientsByPatientIdAppointmentsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetPatientsByPatientIdResponse:
      type: object
      properties:
        patientBanner:
          $ref: common.yaml#/components/schemas/PatientBanner
        patient:
          $ref: common.yaml#/components/schemas/OpaqueObject
      required:
        - patientBanner
        - patient
    GetPatientsByPatientIdBannerResponse:
      type: object
      properties:
        patientBanner:
          $ref: common.yaml#/components/schemas/PatientBanner
      required:
        - patientBanner
    GetPatientsByPatientIdCareTeamResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetPatientsByPatientIdConsentsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetPatientsByPatientIdContactsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetPatientsByPatientIdInsuranceCoveragesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    PatientErrorCode:
      type: string
      enum:
        - patient.merged
        - patient.already_merged
        - patient.merge_pending
        - patient.merge_self_approval
        - patient.match_check_required
        - patient.match_check_stale
        - patient.attach_not_allowed
        - patient.already_linked
        - patient.consent_not_pending
        - patient.channel_unavailable
      x-registry:
        - code: patient.merged
          http: '409'
          retryable: no
        - code: patient.already_merged
          http: 403/409/422
          retryable: no
        - code: patient.merge_pending
          http: 403/409/422
          retryable: no
        - code: patient.merge_self_approval
          http: 403/409/422
          retryable: no
        - code: patient.match_check_required
          http: 403/409/422
          retryable: no
        - code: patient.match_check_stale
          http: 403/409/422
          retryable: no
        - code: patient.attach_not_allowed
          http: 403/409/422
          retryable: no
        - code: patient.already_linked
          http: 403/409/422
          retryable: no
        - code: patient.consent_not_pending
          http: 403/409/422
          retryable: no
        - code: patient.channel_unavailable
          http: 403/409/422
          retryable: no
      description: Section 30 error codes with the patient prefix.
    PostAdminPatientLabelsRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        referenceType:
          type: string
          enum:
            - audit_event
            - privacy_request
            - consent
            - incident
        referenceId:
          type: string
          format: uuid
      required:
        - patientId
        - referenceType
        - referenceId
    PostConsentsByConsentIdSignRequest:
      type: object
      properties:
        signatureDocumentId:
          type: string
          format: uuid
        typedName:
          type: string
          maxLength: 100
      required:
        - typedName
    PatientMergeRequestView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [requested, approved, rejected, executing, completed, failed, cancelled]
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: [string, 'null']
          format: date-time
        failureCode:
          type: [string, 'null']
        counts:
          type: [object, 'null']
          additionalProperties: true
          description: Present after completion only.
        callerIsRequester:
          type: boolean
        survivorId:
          type: [string, 'null']
          format: uuid
          description: Null unless the caller sees the survivor patient.
        mergedId:
          type: [string, 'null']
          format: uuid
          description: Null unless the caller sees the merged patient.
        reason:
          type: [string, 'null']
          description: Null unless the caller is the requester or sees both patients.
      required:
        [
          id,
          status,
          createdAt,
          decidedAt,
          failureCode,
          counts,
          callerIsRequester,
          survivorId,
          mergedId,
          reason,
        ]
    PostPatientMergesRequest:
      type: object
      properties:
        survivorId:
          type: string
          format: uuid
        mergedId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
      required:
        - survivorId
        - mergedId
        - reason
    PostPatientsByPatientIdAttachRequest:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        candidateRef:
          type: string
      required:
        - locationId
        - candidateRef
    PostPatientsMatchResponse:
      type: object
      properties:
        matchCheckId:
          type: string
        candidates:
          type: array
          items:
            type: object
            properties:
              candidateRef:
                type: string
              strength:
                type: string
              matchedFields:
                type: array
                items:
                  type: string
              inScope:
                type: boolean
              display:
                type: object
                additionalProperties: true
            required:
              - candidateRef
              - strength
              - matchedFields
              - inScope
      required:
        - matchCheckId
        - candidates
    PostPatientsRequest:
      type: object
      properties:
        locationId:
          type: string
          format: uuid
        matchCheckId:
          type: string
        duplicateAcknowledged:
          type: boolean
        acknowledgeReason:
          type: string
          maxLength: 500
      required:
        - locationId
        - matchCheckId
        - duplicateAcknowledged
        - acknowledgeReason
      additionalProperties: true
    PostPatientsSearchRequest:
      type: object
      properties:
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
        mrn:
          type: string
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{1,14}$
    PostPatientsSelfRegistrationResponse201:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
      required:
        - patientId
    PutInsuranceCoveragesByIdEligibilityResponse:
      type: object
      properties:
        status:
          type: string
        verifiedAt:
          type: string
          format: date-time
      required:
        - status
        - verifiedAt
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: patient
    description: Module patient
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
