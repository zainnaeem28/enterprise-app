            Idempotent-Replay:
              $ref: common.yaml#/components/headers/IdempotentReplay
          content:
            application/json:
              schema:
                $ref: common.yaml#/components/schemas/OpaqueObject
        '400':
          $ref: common.yaml#/components/responses/Error400
          description: 'Codes: kernel.client_release_unsupported, kernel.idempotency_key_required, kernel.validation_failed.'
        '401':
          $ref: common.yaml#/components/responses/Error401
          description: 'Codes: auth.unauthenticated.'
        '403':
          $ref: common.yaml#/components/responses/Error403
          description: 'Codes: auth.forbidden.'
        '404':
          $ref: common.yaml#/components/responses/Error404
          description: 'Codes: kernel.not_found.'
        '409':
          $ref: common.yaml#/components/responses/Error409
          description: 'Codes: kernel.idempotency_conflict, patient.merged.'
        '413':
          $ref: common.yaml#/components/responses/Error413
          description: 'Codes: kernel.payload_too_large.'
        '429':
          $ref: common.yaml#/components/responses/Error429
          description: 'Codes: kernel.rate_limited.'
        '503':
          $ref: common.yaml#/components/responses/Error503
          description: 'Codes: kernel.unavailable.'
        '504':
          $ref: common.yaml#/components/responses/Error504
          description: 'Codes: kernel.timeout.'
