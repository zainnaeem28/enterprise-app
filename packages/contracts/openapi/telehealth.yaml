components:
  schemas:
    GetAppointmentsByReservationIdVideoSessionResponseMy:
      type: object
      properties:
        status:
          type: string
        admission:
          type: string
        joinOpensAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        needsLocationConfirmation:
          type: boolean
      required:
        - status
        - admission
        - joinOpensAt
        - needsLocationConfirmation
    GetAppointmentsByReservationIdVideoSessionResponseStaff:
      type: object
      properties:
        waiting:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - waiting
      additionalProperties: true
    PostAppointmentsByReservationIdVideoSessionJoinResponseMy:
      type: object
      properties:
        vendor:
          type: string
        meetingId:
          type: string
        attendeeToken:
          type: string
      required:
        - vendor
        - meetingId
        - attendeeToken
    PostAppointmentsByReservationIdVideoSessionLocationRequest:
      type: object
      properties:
        state:
          type: string
      required:
        - state
    TelehealthErrorCode:
      type: string
      enum:
        - telehealth.not_admitted
        - telehealth.location_required
        - telehealth.licensing_refused
        - telehealth.session_closed
        - telehealth.vendor_unavailable
      x-registry:
        - code: telehealth.not_admitted
          http: '409'
          retryable: yes (poll)
        - code: telehealth.location_required
          http: 409/422/503
          retryable: last one yes
        - code: telehealth.licensing_refused
          http: 409/422/503
          retryable: last one yes
        - code: telehealth.session_closed
          http: 409/422/503
          retryable: last one yes
        - code: telehealth.vendor_unavailable
          http: 409/422/503
          retryable: last one yes
      description: Section 30 error codes with the telehealth prefix.
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: telehealth
    description: Module telehealth
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
