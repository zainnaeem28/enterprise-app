components:
  schemas:
    GetAdminPrincipalsResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetAdminStaffSupportResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetPatientsByPatientIdProxiesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProxyGrant'
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    ProxyGrantList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProxyGrant'
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    ProxyScope:
      type: string
      enum:
        - appointments
        - messages
        - documents
    ProxyGrant:
      type: object
      description: 'A proxy grant or open invitation. scopes = granted; effectiveScopes = in force today (after the age rules and validity). inviteeHint is the masked address of an open invitation.'
      required:
        - id
        - patientId
        - relationship
        - scope
        - scopes
        - effectiveScopes
        - guardian
        - patientDisplayName
        - status
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        relationship:
          type: string
          enum:
            - parent
            - guardian
            - carer
            - other
        scope:
          type: string
          enum:
            - appointments
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ProxyScope'
        effectiveScopes:
          type: array
          items:
            $ref: '#/components/schemas/ProxyScope'
        guardian:
          type: boolean
        patientDisplayName:
          type: string
        status:
          type: string
          enum:
            - invited
            - requested
            - verified
            - active
            - revoked
            - expired
        inviteeHint:
          type: string
        validUntil:
          type: string
          format: date
    ProxyInviteRequest:
      type: object
      required:
        - email
        - relationship
      properties:
        email:
          type: string
          maxLength: 254
        relationship:
          type: string
          enum:
            - parent
            - guardian
            - carer
            - other
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ProxyScope'
    ProxyScopesRequest:
      type: object
      required:
        - scopes
      properties:
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ProxyScope'
    ProxyAcceptRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          pattern: '^[0-9]{6,10}$'
    GuardianLinkRequest:
      type: object
      required:
        - email
        - relationship
        - documentId
      properties:
        email:
          type: string
          maxLength: 254
        relationship:
          type: string
          enum:
            - parent
            - guardian
        documentId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ProxyScope'
    IdentityErrorCode:
      type: string
      enum:
        - identity.elevation_required
        - identity.sign_in_failed
        - identity.elevation_failed
        - identity.enrolment_failed
        - identity.self_approval
        - identity.approver_is_subject
        - identity.request_expired
        - identity.role_realm_mismatch
        - identity.privileged_role_in_staff_realm
        - identity.proxy_rules_not_configured
        - identity.proxy_invite_invalid
        - identity.proxy_not_allowed
        - identity.proxy_conflict
      x-registry:
        - code: identity.elevation_required
          http: '403'
          retryable: no
        - code: identity.sign_in_failed
          http: '401'
          retryable: no
        - code: identity.elevation_failed
          http: '401'
          retryable: no
        - code: identity.enrolment_failed
          http: '401'
          retryable: no
        - code: identity.self_approval
          http: 403/409/422
          retryable: no
        - code: identity.approver_is_subject
          http: 403/409/422
          retryable: no
        - code: identity.request_expired
          http: 403/409/422
          retryable: no
        - code: identity.role_realm_mismatch
          http: 403/409/422
          retryable: no
        - code: identity.privileged_role_in_staff_realm
          http: 403/409/422
          retryable: no
        - code: identity.proxy_rules_not_configured
          http: 403/409/422
          retryable: no
        - code: identity.proxy_invite_invalid
          http: 403/409/422
          retryable: no
        - code: identity.proxy_not_allowed
          http: 403/409/422
          retryable: no
        - code: identity.proxy_conflict
          http: 403/409/422
          retryable: no
      description: Section 30 error codes with the identity prefix.
    PostAdminAuthElevationVerifyResponse:
      type: object
      properties:
        elevationExpiresAt:
          type: string
          format: date-time
      required:
        - elevationExpiresAt
    PostAdminAuthSignInOptionsRequest:
      type: object
      properties:
        handle:
          type: string
      required:
        - handle
    PostAdminAuthSignInVerifyRequest:
      type: object
      properties:
        challengeId:
          type: string
        handle:
          type: string
        assertion:
          type: object
          additionalProperties: true
      required:
        - challengeId
        - handle
        - assertion
    PostAdminPrincipalsByIdKillSwitchRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
      required:
        - reason
    PostAdminRoleChangeRequestsRequest:
      type: object
      properties:
        subjectPrincipalId:
          type: string
          format: uuid
        add:
          type: array
          items:
            type: object
            properties:
              roleKey:
                type: string
              locationId:
                type: string
                format: uuid
            required:
              - roleKey
        remove:
          type: array
          items:
            type: object
            properties:
              roleKey:
                type: string
              locationId:
                type: string
                format: uuid
            required:
              - roleKey
      required:
        - subjectPrincipalId
        - add
        - remove
    PostAuthSessionExtendResponse:
      type: object
      properties:
        idleExpiresAt:
          type: string
          format: date-time
      required:
        - idleExpiresAt
    PutAdminStaffProfilesByPrincipalIdRequest:
      type: object
      properties:
        displayName:
          type: string
        licensedStates:
          type: array
          items:
            type: string
        npi:
          type: string
        prescriber:
          type: boolean
        trainee:
          type: boolean
        supervisor:
          type: string
          format: uuid
        directoryListed:
          type: boolean
      additionalProperties: true
    Session:
      type: object
      properties:
        principalId:
          type: string
          format: uuid
        realm:
          type: string
        audience:
          type: string
        displayName:
          type: string
        csrfToken:
          type: string
        idleExpiresAt:
          type: string
          format: date-time
        elevationExpiresAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              locationId:
                type: string
                format: uuid
            required:
              - key
        permissions:
          type: array
          items:
            type: string
        patients:
          type: array
          items:
            type: object
            properties:
              patientId:
                type: string
                format: uuid
              relation:
                type: string
                enum:
                  - self
                  - proxy
              scope:
                type: string
              scopes:
                type: array
                items:
                  type: string
                  enum:
                    - appointments
                    - messages
                    - documents
            required:
              - patientId
              - relation
              - scope
              - scopes
      required:
        - principalId
        - realm
        - audience
        - displayName
        - csrfToken
        - idleExpiresAt
        - roles
        - permissions
        - patients
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
tags:
  - name: identity
    description: Module identity
servers:
  - url: https://my.{domain}
    description: Patient portal host (my.)
    variables:
      domain:
        default: example.invalid
  - url: https://staff.{domain}
    description: Staff and admin portal host (staff.)
    variables:
      domain:
        default: example.invalid
  - url: https://integrations.{domain}
    description: Integrations host (integrations.)
    variables:
      domain:
        default: example.invalid
