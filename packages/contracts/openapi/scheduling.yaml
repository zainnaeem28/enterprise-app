components:
  schemas:
    GetAppointmentsByReservationIdPrevisitResponse:
      description: Pre-visit status. requiredConsents is null when the caller is a proxy for the patient (a proxy neither sees nor signs consents).
      type: object
      additionalProperties: false
      required:
        - reservationId
        - questionnaire
        - consents
        - insurance
        - requiredConsents
      properties:
        reservationId:
          type: string
          format: uuid
        questionnaire:
          type: boolean
        consents:
          description: Every required template is signed in its latest published version.
          type: boolean
        insurance:
          type: boolean
        requiredConsents:
          oneOf:
            - type: 'null'
            - type: array
              maxItems: 50
              items:
                $ref: '#/components/schemas/PrevisitRequiredConsent'
    PrevisitRequiredConsent:
      type: object
      additionalProperties: false
      required:
        - id
        - templateKey
        - templateVersion
        - language
        - title
        - text
        - status
      properties:
        id:
          description: The pending patient.consent id; null unless status is pending.
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        templateKey:
          type: string
          maxLength: 100
        templateVersion:
          description: The latest published version (the one required).
          type: integer
          minimum: 1
        language:
          description: Language of title and text actually returned.
          type: string
          maxLength: 35
        title:
          oneOf:
            - type: string
              maxLength: 200
            - type: 'null'
        text:
          description: Plain text, never HTML. Null only for a version published before the wording was stored.
          oneOf:
            - type: string
              maxLength: 20000
            - type: 'null'
        status:
          type: string
          enum:
            - signed
            - pending
            - missing
            - outdated
    ClinicianScheduleItem:
      description: A subset of the arrivals board row. The front-desk fields (method, previsit, noShowCandidate, flaggedForStaff, version) are left out on purpose.
      type: object
      additionalProperties: false
      required:
        - reservationId
        - patientId
        - patientName
        - mrn
        - serviceId
        - mode
        - status
        - startsAt
        - endsAt
        - checkedInAt
        - queueStage
      properties:
        reservationId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        patientName:
          oneOf:
            - type: string
            - type: 'null'
        mrn:
          oneOf:
            - type: string
            - type: 'null'
        serviceId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
            - in_person
            - video
        status:
          type: string
          enum:
            - confirmed
            - checked_in
            - in_consultation
            - completed
            - no_show
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        checkedInAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        queueStage:
          oneOf:
            - type: string
              enum:
                - waiting
                - vitals
                - triage
                - ready
                - with_clinician
                - done
            - type: 'null'
    GetCliniciansByIdScheduleResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - timeZone
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClinicianScheduleItem'
        timeZone:
          type: string
    GetAdminCliniciansByIdAvailabilityTemplatesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetAdminCliniciansByIdBlockedTimesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetAdminLocationsByIdRosterResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetCliniciansByIdAvailabilityTemplatesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetCliniciansByIdBlockedTimesResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetLocationsByIdRosterResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    GetLocationsByLocationIdCheckInQrResponse:
      type: object
      properties:
        token:
          type: string
        localDate:
          type: string
          format: date
      required:
        - token
        - localDate
    GetWaitlistResponse:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: common.yaml#/components/schemas/OpaqueObject
        nextCursor:
          oneOf:
            - type: string
            - type: 'null'
    PostAppointmentsByIdCheckInResponse:
      type: object
      properties:
        previsit:
          type: object
          properties:
            questionnaire: {}
            consents: {}
            insurance: {}
          required:
            - questionnaire
            - consents
            - insurance
        patientBanner:
          $ref: common.yaml#/components/schemas/PatientBanner
      required:
        - previsit
        - patientBanner
    PostAppointmentsByReservationIdCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        acceptFee:
          type: boolean
    PostAppointmentsByReservationIdRescheduleRequest:
      type: object
      properties:
        newHoldId:
          type: string
          format: uuid
      required:
        - newHoldId
    PostAvailabilitySearchRequest:
      type: object
      properties:
        serviceId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        clinicianId:
          type: string
          format: uuid
        mode:
          type: string
        from:
          type: string
          format: date-time
          description: Half-open range [from, to), from < to; the range is at most 31 days (31.1).
        to:
          type: string
          format: date-time
          description: Half-open range [from, to), from < to; the range is at most 31 days (31.1).
        includeOverbook:
          type: boolean
      required:
        - serviceId
        - mode
        - from
        - to
    PostAvailabilitySearchResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            type: object
            properties:
              startsAt:
                type: string
                format: date-time
              endsAt:
                type: string
                format: date-time
              clinicianId:
                type: string
                format: uuid
              locationId:
                type: string
                format: uuid
              mode:
                type: string
            required:
              - startsAt
              - endsAt
              - clinicianId
              - locationId
              - mode
        availabilityStale:
          type: boolean
      required:
        - slots
        - availabilityStale
    PostCheckInsRequest:
      type: object
      properties:
        reservationId:
          type: string
          format: uuid
        qrToken:
          type: string
      required:
        - reservationId
        - qrToken
    PostHoldsRequest:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
      required:
        - patientId
      additionalProperties: true
    PostHoldsResponse201:
      type: object
      properties:
        reservationId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
      required:
        - reservationId
        - expiresAt
    PutAppointmentsByIdAssignmentRequest:
      type: object
      properties:
        clinicianId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
    SchedulingErrorCode:
      type: string
      enum:
        - scheduling.slot_taken
        - scheduling.hold_expired
        - scheduling.max_future_reached
        - scheduling.overlapping_appointment
        - scheduling.licensing_refused
        - scheduling.lead_time
        - scheduling.outside_hours
        - scheduling.cutoff_passed
        - scheduling.fee_acceptance_required
        - scheduling.waitlist_disabled
        - scheduling.check_in_not_allowed
        - scheduling.grace_not_elapsed
        - scheduling.invalid_transition
        - scheduling.conflicts_with_appointments
        - scheduling.offer_expired
        - scheduling.roster_principal_ineligible
      x-registry:
        - code: scheduling.slot_taken
          http: '409'
          retryable: no
        - code: scheduling.hold_expired
          http: '409'
          retryable: no
        - code: scheduling.max_future_reached
          http: 409/422
          retryable: no
        - code: scheduling.overlapping_appointment
          http: 409/422
          retryable: no
        - code: scheduling.licensing_refused
          http: 409/422
          retryable: no
        - code: scheduling.lead_time
          http: 409/422
          retryable: no
        - code: scheduling.outside_hours
          http: 409/422
          retryable: no
        - code: scheduling.cutoff_passed
          http: 409/422
          retryable: no
        - code: scheduling.fee_acceptance_required
          http: 409/422
          retryable: no
        - code: scheduling.waitlist_disabled
          http: 409/422
          retryable: no
        - code: scheduling.check_in_not_allowed
          http: 409/422
          retryable: no
        - code: scheduling.grace_not_elapsed
          http: 409/422
          retryable: no
        - code: scheduling.invalid_transition
          http: 409/422
          retryable: no
        - code: scheduling.conflicts_with_appointments
          http: 409/422
          retryable: no
        - code: scheduling.offer_expired
          http: '409'
          retryable: no
        - code: scheduling.roster_principal_ineligible
          http: '422'
          retryable: no
      description: Section 30 error codes with the scheduling prefix.
  securitySchemes:
    sessionCookie:
      $ref: common.yaml#/components/securitySchemes/sessionCookie
